<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 184" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="annotationspipeline-title annotationspipeline-desc">
      <title id="annotationspipeline-title">Vom Produktions-Trace zum Goldset</title>
      <desc id="annotationspipeline-desc">Produktionsanfragen werden stratifiziert gezogen, annotiert und zum Goldset verdichtet, das jeden Deploy als Regressionstest absichert.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5F6062"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#DB0031"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#007FC5"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#ffffff"/>
      <path d="M 196,92 H 224" fill="none" stroke="#5F6062" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 376,92 H 404" fill="none" stroke="#5F6062" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 556,92 H 584" fill="none" stroke="#5F6062" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 736,92 H 764" fill="none" stroke="#5F6062" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="44" y="48" width="152" height="88" rx="6" fill="#ffffff"/>
      <rect x="44" y="48" width="152" height="88" rx="6" fill="#ffffff" stroke="#1A171B" stroke-width="1"/>
      <text x="120.0" y="91.0" fill="#1A171B" font-size="16" font-weight="700" font-family="'Trebuchet MS','Lucida Grande','Lucida Sans Unicode',Arial,Helvetica,sans-serif" text-anchor="middle">Traces</text>
      <text x="120.0" y="113.0" fill="#5F6062" font-size="12" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" text-anchor="middle">aus Produktion</text>
      <rect x="224" y="48" width="152" height="88" rx="6" fill="#ffffff"/>
      <rect x="224" y="48" width="152" height="88" rx="6" fill="#ffffff" stroke="#1A171B" stroke-width="1"/>
      <text x="300.0" y="91.0" fill="#1A171B" font-size="16" font-weight="700" font-family="'Trebuchet MS','Lucida Grande','Lucida Sans Unicode',Arial,Helvetica,sans-serif" text-anchor="middle">Stichprobe</text>
      <text x="300.0" y="113.0" fill="#5F6062" font-size="12" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" text-anchor="middle">stratifiziert</text>
      <rect x="404" y="48" width="152" height="88" rx="6" fill="#ffffff"/>
      <rect x="404" y="48" width="152" height="88" rx="6" fill="#ffffff" stroke="#1A171B" stroke-width="1"/>
      <text x="480.0" y="91.0" fill="#1A171B" font-size="16" font-weight="700" font-family="'Trebuchet MS','Lucida Grande','Lucida Sans Unicode',Arial,Helvetica,sans-serif" text-anchor="middle">Annotation</text>
      <text x="480.0" y="113.0" fill="#5F6062" font-size="12" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" text-anchor="middle">Queue + Annotator</text>
      <rect x="584" y="48" width="152" height="88" rx="6" fill="#ffffff"/>
      <rect x="584" y="48" width="152" height="88" rx="6" fill="rgba(219,0,49,0.07)" stroke="#DB0031" stroke-width="1.4"/>
      <text x="660.0" y="91.0" fill="#1A171B" font-size="16" font-weight="700" font-family="'Trebuchet MS','Lucida Grande','Lucida Sans Unicode',Arial,Helvetica,sans-serif" text-anchor="middle">Eval-Dataset</text>
      <text x="660.0" y="113.0" fill="#5F6062" font-size="12" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" text-anchor="middle">Goldset</text>
      <rect x="764" y="48" width="152" height="88" rx="6" fill="#ffffff"/>
      <rect x="764" y="48" width="152" height="88" rx="6" fill="#ffffff" stroke="#1A171B" stroke-width="1"/>
      <text x="840.0" y="91.0" fill="#1A171B" font-size="16" font-weight="700" font-family="'Trebuchet MS','Lucida Grande','Lucida Sans Unicode',Arial,Helvetica,sans-serif" text-anchor="middle">Regressionstest</text>
      <text x="840.0" y="113.0" fill="#5F6062" font-size="12" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" text-anchor="middle">pro Deploy</text>
    </svg>
