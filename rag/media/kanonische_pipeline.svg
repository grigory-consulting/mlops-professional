      <title id="kanonische-pipeline-title">Kanonische Pipeline</title>
      <desc id="kanonische-pipeline-desc">Der Bi-Encoder holt breit aus dem Index (Top-100), der Cross-Encoder bewertet jedes Paar neu und verdichtet auf Top-10, erst diese Kontexte sieht das LLM.</desc>
