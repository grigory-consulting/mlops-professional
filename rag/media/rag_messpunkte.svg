      <title id="rag-messpunkte-title">Zwei Messpunkte im RAG-Pfad</title>
      <desc id="rag-messpunkte-desc">Context-Recall misst, ob die belegende Stelle überhaupt abgerufen wurde; Faithfulness misst, ob die Antwort durch den abgerufenen Kontext gedeckt ist.</desc>
