<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="verteidigung-schichten-title verteidigung-schichten-desc">
      <title id="verteidigung-schichten-title">Defense-in-Depth: fünf Schichten</title>
      <desc id="verteidigung-schichten-desc">Fünf Schutzschichten gegen Prompt Injection, jede mit der Lücke, die sie offen lässt; das Restrisiko wandert bis zur Design-Ebene durch.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5F6062"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#DB0031"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#007FC5"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#ffffff"/>
      <path d="M 208,68 V 80" fill="none" stroke="#5F6062" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="48" y="24" width="320" height="44" rx="6" fill="#ffffff"/>
      <rect x="48" y="24" width="320" height="44" rx="6" fill="rgba(26,23,27,0.03)" stroke="rgba(26,23,27,0.30)" stroke-width="1"/>
      <text x="208.0" y="51.0" fill="#1A171B" font-size="16" font-weight="700" font-family="'Trebuchet MS','Lucida Grande','Lucida Sans Unicode',Arial,Helvetica,sans-serif" text-anchor="middle">Injection-Versuch im Dokument</text>
      <rect x="48" y="80" width="800" height="64" rx="0" fill="#ffffff" stroke="#1A171B" stroke-width="1"/>
      <text x="72" y="120" fill="#7B7C7E" font-size="12" font-weight="700" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" letter-spacing="0.14em">L1</text>
      <text x="120" y="120" fill="#1A171B" font-size="16" font-weight="700" font-family="'Trebuchet MS','Lucida Grande','Lucida Sans Unicode',Arial,Helvetica,sans-serif">Ingest-Scanning · ACL / Tenant-Trennung</text>
      <text x="824" y="120" fill="#5F6062" font-size="12" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" text-anchor="end">offen: erlaubte Dokumente mit Gift</text>
      <rect x="48" y="144" width="800" height="64" rx="0" fill="#ffffff" stroke="#1A171B" stroke-width="1"/>
      <text x="72" y="184" fill="#7B7C7E" font-size="12" font-weight="700" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" letter-spacing="0.14em">L2</text>
      <text x="120" y="184" fill="#1A171B" font-size="16" font-weight="700" font-family="'Trebuchet MS','Lucida Grande','Lucida Sans Unicode',Arial,Helvetica,sans-serif">Spotlighting im System-Prompt</text>
      <text x="824" y="184" fill="#5F6062" font-size="12" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" text-anchor="end">offen: gut getarnte Anweisungen</text>
      <rect x="48" y="208" width="800" height="64" rx="0" fill="#ffffff" stroke="#1A171B" stroke-width="1"/>
      <text x="72" y="248" fill="#7B7C7E" font-size="12" font-weight="700" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" letter-spacing="0.14em">L3</text>
      <text x="120" y="248" fill="#1A171B" font-size="16" font-weight="700" font-family="'Trebuchet MS','Lucida Grande','Lucida Sans Unicode',Arial,Helvetica,sans-serif">Output-Guardrails (z. B. Llama Guard)</text>
      <text x="824" y="248" fill="#5F6062" font-size="12" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" text-anchor="end">offen: unauffällige Manipulation</text>
      <rect x="48" y="272" width="800" height="64" rx="0" fill="rgba(219,0,49,0.07)" stroke="#DB0031" stroke-width="1.4"/>
      <text x="72" y="312" fill="#7B7C7E" font-size="12" font-weight="700" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" letter-spacing="0.14em">L4</text>
      <text x="120" y="312" fill="#1A171B" font-size="16" font-weight="700" font-family="'Trebuchet MS','Lucida Grande','Lucida Sans Unicode',Arial,Helvetica,sans-serif">Least-Privilege · Human-in-the-Loop</text>
      <text x="824" y="312" fill="#5F6062" font-size="12" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" text-anchor="end">begrenzt die Folgen, nicht den Angriff</text>
      <rect x="48" y="336" width="800" height="64" rx="0" fill="rgba(26,23,27,0.05)" stroke="#5F6062" stroke-width="1"/>
      <text x="72" y="376" fill="#7B7C7E" font-size="12" font-weight="700" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" letter-spacing="0.14em">L5</text>
      <text x="120" y="376" fill="#1A171B" font-size="16" font-weight="700" font-family="'Trebuchet MS','Lucida Grande','Lucida Sans Unicode',Arial,Helvetica,sans-serif">Grundannahme: Injection gelingt</text>
      <text x="824" y="376" fill="#5F6062" font-size="12" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" text-anchor="end">Design-Ebene: Schichten kompensieren einander</text>
      <path d="M 888,80 V 396" fill="none" stroke="#DB0031" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="836" y="56" width="104" height="14" rx="2" fill="#ffffff"/>
      <text x="888" y="67" fill="#DB0031" font-size="11" font-weight="700" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" text-anchor="middle" letter-spacing="0.08em">RESTRISIKO</text>
    </svg>
