## RAG wird zum Tool im Agent-Loop

In agentischen Systemen ist Retrieval **nicht fest verdrahtet**, sondern ein Tool unter mehreren. Das LLM entscheidet pro Schritt, welches Tool es mit welchen Argumenten aufruft.

**Beispiel, Frage:** *"Warum überhitzt die Pumpe seit gestern?"*

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Think:** Ich brauche Ursachen aus dem Handbuch und aktuelle Sensorwerte.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Act:** `retrieve_docs("P-12 Überhitzung Ursachen")` zu Handbuch-Chunks (Kühlkreislauf).
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Act:** `query_sensor_api("P-12", "Kühlmitteldurchfluss", "24h")` zu Wert 40 % unter Soll.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Answer:** belegte Hypothese (Kühlmittelmangel) mit Quellenangaben.

```python
# Tool-Registry (vereinfacht): RAG ist nur ein Werkzeug unter mehreren
TOOLS = {
    "retrieve_docs":    {"args": ["query"],                  "desc": "Semantische Suche im Korpus"},
    "query_sensor_api": {"args": ["asset_id", "metric", "window"], "desc": "Live-Sensorwerte"},
    "search_tickets":   {"args": ["query"],                  "desc": "Wartungs- und Störungstickets"},
}
```
<!-- .element: class="fragment" -->

In der Praxis registrieren Sie solche Tools heute über das **Model Context Protocol (MCP)**, den herstellerübergreifenden Standard seit 2025; das Retrieval ist dann ein MCP-Tool unter anderen.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Agent-Eval: die Trajektorie bewerten

Standard-RAG bewertet **eine Antwort**. Beim Agenten muss die **gesamte Trajektorie** bewertet werden, nicht nur das Endergebnis.

| Achse | Frage an die Trajektorie |
|---|---|
| **Plan-Qualität** | War die Schrittfolge sinnvoll, ohne Umwege oder Schleifen? |
| **Tool-Wahl** | Wurde pro Schritt das passende Tool gewählt? |
| **Argument-Korrektheit** | Waren die Tool-Argumente korrekt (z. B. `asset_id="P-12"`)? |
| **Error-Recovery** | Wie reagiert der Agent auf Fehler, Leertreffer, Timeouts? |
| **Autorisierung / Side-Effects** | Wurden nur erlaubte, beabsichtigte Aktionen ausgeführt? |

> [!warning]
> Ein Judge-Score ist **probabilistisch**. Für Geld, Credentials, Produktionssysteme oder irreversible Aktionen gilt **Human-in-the-Loop deterministisch**: erst Freigabe, dann Ausführung. Verlassen Sie sich nie allein auf den Judge, kombinieren Sie ihn mit festen Kontrollen.

> [!note]
> Die OWASP Top 10 for Agentic Applications (Dezember 2025, ASI01 bis ASI10: Goal Hijack, Tool Misuse, Identitäts- und Rechtemissbrauch, ...) liefern die Prüfliste für die Achse Autorisierung und Side-Effects.

## GraphRAG: vom Chunk zum Wissensgraph

**Microsoft GraphRAG** baut zur Indexierungszeit einen Graphen statt nur einen Chunk-Index. Ein LLM extrahiert **Entitäten** und **Relationen**, erkennt **Communities** (dicht verbundene Knoten-Cluster) und schreibt pro Community eine Zusammenfassung.

<img src="media/graphrag_ingest.svg" alt="" style="width: 74%; object-fit: fill">


**Im Graphen:** Knoten *Pumpe*, *Dichtung D-7*, *Wartungsereignis 2026-05*, *Technikerin Vogt*; Kanten *hat-Teil*, *gewartet-von*, *verursacht*. Aus solchen Pfaden werden Multi-Hop-Antworten.
</div></script></section><section data-separator="

## Local Search vs. Global Search

<div class="two-col">
<div style="flex: 50">

### Local Search
Startet bei **konkreten Entitäten** und expandiert deren Nachbarschaft im Graphen.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Für **spezifische** Fragen.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->*"Welche Dichtung ist in der Pumpe verbaut und wann wurde sie zuletzt getauscht?"*
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Antwort entsteht aus dem unmittelbaren Entity-Umfeld plus zugehörigen Chunks.

</div>
<div style="flex: 50">

### Global Search <!-- .element: class="fragment" data-fragment-index="4" -->
Nutzt die **Community-Summaries** für korpusweite, thematische Fragen.
<!-- .element: class="fragment" data-fragment-index="4" -->

- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Für **synthetisierende** Fragen.
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->*"Welche Ausfallmuster betreffen die gesamte Baureihe P?"*
- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->Query-focused Summarization aggregiert über viele Communities (Map-Reduce über die Summaries).

</div>
</div>

> [!note]
> Faustregel: **Local** beantwortet "was gilt für diese Entität?", **Global** beantwortet "was sagt der Korpus insgesamt zum Thema?".
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## GraphRAG: wann lohnt es?

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Vorteil:** Multi-Hop-Fragen, die Fakten über mehrere Entitäten hinweg verknüpfen, und korpusweite Synthese, an der reines Chunk-Retrieval scheitert.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Kosten:** teure Indexierung (viele LLM-Calls für Extraktion und Summaries), Pflegeaufwand bei jeder Korpus-Änderung. LazyGraphRAG (Microsoft, 2024) verschiebt diese Kosten von der Indexierung in die Abfrage und bringt den Index-Aufwand nahe an Vektor-RAG.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Overhead bei kleinen Korpora:** für einen überschaubaren, gut chunkbaren Textbestand ist GraphRAG Overkill.

**Empfehlung (Hybrid):** Sparse- bzw. Dense-RAG als Default, **KG-Fallback** nur für erkannte Multi-Hop- oder Synthese-Fragen. Ein Router klassifiziert die Anfrage und schaltet den Graphen nur dazu, wenn er gebraucht wird.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Multimodale Daten: Dokumente sind visuell

ColPali und DSE setzen an einem Punkt an: reale Dokumente sind **visuell**. Der klassische **Parse-then-Embed**-Pfad (OCR, Layout-Erkennung, Reading-Order, Captioning, Chunking) reicht Fehler von Stufe zu Stufe weiter und scheitert oft an Tabellen, Schaltplänen und Scans.

**Quellen, die genau das treffen:** Hydraulikschaltplan, Maßtabelle im Handbuch, handschriftliches Wartungsprotokoll.

| Pfad | nDCG@5 (ViDoRe) | Indexierung |
|---|---|---|
| Parse-then-Embed (+ VLM-Captions) | 67,0 | 7,22 s/Seite |
| Vision-native (ColPali) | 81,3 | 0,39 s/Seite |

> [!note]
> Zahlen aus dem ColPali-Paper (2024, ViDoRe v1). Aktueller Benchmark ist ViDoRe V3 (2026): 10 Datensätze, 3.099 Queries in 6 Sprachen, nDCG@10. Auch dort schlagen visuelle Retriever die textuellen, Late Interaction und Reranking helfen deutlich. Die zwei Pfade kennen Sie aus Teil IV; hier geht es um den Vision-nativen Ausbau.
</div></script></section><section data-separator="

## Multimodale Retriever: ColPali & Kandidaten

**ColPali** (Late Interaction, Multi-Vector): PaliGemma-3B projiziert Bild-Patch-Embeddings in den Textraum. Jede Seite wird zu rund **1.000 Patch-Vektoren** (Dimension 128); Queries werden ColBERT-artig per **MaxSim** gematcht. Reported: 81,3 nDCG@5, Query-Encoding ca. 30 ms, rund 257,5 KB/Seite (float16).

**Kandidaten zum Benchmarken** (Hersteller- bzw. Autor-Claims, nicht adjudiziert):

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**ColQwen2 / ColQwen2.5 / ColQwen3.x** (Qwen-VL-Backbones, Multi-Vector, ColPali-Familie) und **jina-embeddings-v4** (Multi- und Single-Vector in einem Modell).
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Voyage multimodal-3.5** (Single-Vector, ein Backbone für Text, Bild und Video; Doku Stand Januar 2026: 32k Tokens je Eingabe, 560 Bildpixel = 1 Token, Dimensionen 256/512/1024/2048).
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Cohere Embed v4** (gemeinsamer Vektorraum für Text, Bild und interleaved PDFs; Doku: 128k Token-Kontext, Output-Dimensionen 256/512/1024/1536).

> [!warning]
> Leaderboard-Vergleiche (z. B. ColNomic) sind **autor-reported**. ColPali als verifizierter Anker, die übrigen Modelle als zu benchmarkende Kandidaten behandeln, nicht als gesetzte Sieger.
<!-- .element: class="fragment" -->

## Multimodal: Konsequenzen für die Pipeline

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Retrieval** läuft auf visuellen **und** textuellen Features statt nur auf extrahiertem Text.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Generator muss multimodal sein:** ein VLM zur Antwortzeit, sonst kann das Modell das Seitenbild nicht lesen.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Storage:** rund 1.000 Vektoren/Seite. Mitigation: Patch-Vektoren mean-poolen für eine billige erste Stufe, dann mit vollem Multi-Vector reranken.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Citation:** Seitenbild plus Seitenzahl statt Text-Span.
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Löschung/Redaktion gröber:** Granularität ist die ganze Seite (relevant für DSGVO-Löschpflichten, siehe Anhang).

> [!tip]
> Vision-Retrieval und strukturierte Extraktion ergänzen sich: für **präzisionskritische Tabellen** weiter Option A (HTML/Markdown-Extraktion) nutzen, Vision-native für visuell komplexe Seiten.
<!-- .element: class="fragment" data-fragment-index="6" -->
</div></script></section><section data-separator="

## Real-Time-Augmentation: frische Daten

Manche Fragen brauchen Daten, die der Index zur Indexierungszeit nicht kennt: **Live-Sensorwerte, Ersatzteil-Verfügbarkeit, aktuelle Normen oder Preise**. Diese Daten ändern sich laufend und veralten im statischen Index schnell.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Live-Queries:** APIs, interne Suche oder Web-Suche als Tool im Agent-Loop (statt im Index).
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Temporales Grounding:** Zeitstempel mitführen und den **Stand** in die Antwort schreiben (*"Stand: 2026-06-28, 14:00"*).

**Beispiel:** aktueller Kühlmitteldurchfluss aus der Maschinen-API, Ersatzteilbestand aus dem ERP, statt veralteter Werte aus dem letzten Index-Lauf.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Real-Time: Retrieval + Generation + Fact-Check-Zyklus

<img src="media/frische_fact_check.svg" alt="" style="width: 70%; object-fit: fill">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Der **Fact-Check** prüft die generierte Antwort gegen die frisch geholten Quellen (NLI- oder Judge-Check, vgl. Teil XI), **bevor** ausgeliefert wird.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Verwandt mit **Self-Route:** das Modell prüft zuerst selbst, ob der Kontext die Frage deckt, und reicht nur ungedeckte Fälle weiter. Das spart Kosten bei gleichbleibender Qualität.
</div></script></section><section data-separator="

## Entscheidungshilfe: welche Erweiterung wann?

| Use-Case / Symptom | Erweiterung | Aufwand |
|---|---|---|
| Mehrschritt-Aufgaben, Tool-Nutzung, Aktionen | **Agent-Workflow (ReAct)** | hoch (Trajektorien-Eval, Guardrails, HITL) |
| Multi-Hop über Entitäten, korpusweite Synthese | **GraphRAG** | hoch (teure Indexierung, Pflege) |
| Visuelle Dokumente (Pläne, Tabellen, Scans) | **Vision-native / multimodal** | mittel bis hoch (VLM, Storage) |
| Volatile, zeitkritische Daten | **Real-Time-Augmentation** | mittel (APIs, Fact-Check-Zyklus) |
| Kleiner, stabiler Textkorpus | **keine** | gering (Standard-RAG genügt) |

**Leitsatz:** Erst das Fehlerbild **messen** (Teil VII/IX), dann gezielt **eine** Erweiterung wählen. Nicht alle vier gleichzeitig.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Vom Prototyp zur produktiven Plattform

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Stufe 1:** belastbares Standard-RAG mit Goldset, Eval und Citations (Teile I bis IX).
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Stufe 2:** **genau eine** Erweiterung gegen ein gemessenes Fehlerbild, nicht auf Vorrat.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Stufe 3:** Betrieb (Monitoring, Drift, Canary, Kosten) plus Governance (DSGVO, Audit) aus dem Anhang, Teil X und Teil XI.

**Plattform-Prinzip:** Für jede Erweiterung gelten **dieselben** Anforderungen: Versionierung, Eval-Gate, Canary-Rollout, Observability. Behandeln Sie einen neuen Agenten, einen KG-Index oder einen Vision-Retriever nicht als Config-Change, sondern als **Release**.
<!-- .element: class="fragment" -->

## Recap & Transfer

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Agent-Workflows:** ReAct-Loop (Think zu Act zu Observe), RAG als Tool, Trajektorie statt nur Antwort bewerten, HITL für riskante Aktionen.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**GraphRAG:** Entity- und Community-Extraktion, Local vs. Global Search, Stärke bei Multi-Hop, Hybrid mit KG-Fallback.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Multimodal:** Dokumente sind visuell, ColPali mit rund 1.000 Vektoren/Seite, Generator muss multimodal sein.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Real-Time:** Live-Query plus Fact-Check-Zyklus für volatile Daten, Stand mitführen.
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Entscheidung:** erst Fehlerbild, dann Erweiterung; Aufwand gegen Nutzen abwägen.

> [!tip]
> **Transferaufgabe:** Wählen Sie für Ihren Assistenten **genau eine** Erweiterung und benennen Sie das konkrete Fehlerbild, das sie behebt, plus die Metrik, an der Sie den Erfolg messen.

## Lernziele & Roadmap

Nach diesem Teil kennen Sie die DSGVO-relevanten Pflichten, die ein RAG-System auslöst, sobald es echte Firmendokumente indexiert.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**PII** im Index: Wartungsprotokolle der Hydraulikpumpe enthalten Techniker-Namen, also personenbezogene Daten.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Rechtsgrundlage**: Embedding und Vektor-DB sind Datenverarbeitung (Art. 6 DSGVO).
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Löschung & Retention**: was im Retrieval-Layer geht und was am Modell offenbleibt.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Provenance & Versionierung**: Quelle/Version je Chunk, Blue/Green-Reindex ohne Downtime.
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Organisation**: DPIA (Art. 35), Tenant-Trennung, Betriebsrat, EU AI Act, Datensouveränität.

Leitlinie: Treffen Sie Compliance-Entscheidungen schon beim Architekturentwurf, nicht erst nachträglich.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Embedding + Vektor-DB ist Datenverarbeitung

Wenn Sie Handbücher, Wartungsprotokolle und Wikis indexieren, verarbeiten Sie **personenbezogene Daten** und brauchen dafür eine **Rechtsgrundlage nach Art. 6 DSGVO**.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Sobald ein Wartungsprotokoll der Pumpe Namen, Personalnummern oder Unterschriften enthält, wandern diese Daten in **Chunks, Embeddings und Metadaten**.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Die DSK-Orientierungshilfe hält ausdrücklich fest: das Einbetten von Referenzdokumenten und ihre Speicherung in einer Vektor-DB ist **selbst Verarbeitung** und benötigt eine Rechtsgrundlage.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Praktische Konsequenz: Zweckbindung, Datenminimierung und Lösch-/Aufbewahrungsregeln gelten für den Index genauso wie für die Quelldatenbank.
</div></script></section><section data-separator="

## DSK RAG-Orientierungshilfe (Oktober 2025)

Die Datenschutzkonferenz (DSK) befasst sich inzwischen direkt mit RAG. Die zentrale Aussage entlastet Sie in der Praxis erheblich.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Referenzdokumente und Vektor-DB-Einträge sind **direkt adressierbar**: personenbezogene Daten lassen sich gezielt löschen, indem man die **DB-Einträge entfernt und die Quelldokumente löscht**.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Klassische **Aufbewahrungs- und Löschmechanismen** sind für Vektor-DB und Referenzkorpus **wiederverwendbar**, anders als beim Modell.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->RAG kann unter **EDPB Opinion 28/2024** als risikomindernde Maßnahme zählen.

> [!note]
> Die RAG-Orientierungshilfe (18 Seiten) ist für Sie Pflichtlektüre. Den Index bekommen Sie damit in den Griff; ungelöst bleibt das **Modellgewicht selbst**.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Modellgewicht: Löschen ist hier nicht so einfach

Beim Retrieval-Layer ist Löschen mechanisch klar. Beim Modell, das auf personenbezogenen Daten trainiert wurde, ist die Rechtslage offen und umstritten.

<div class="two-col">
<div style="flex: 50">

**EDPB Opinion 28/2024**

Trainierte Modelle sind *nicht automatisch anonym*: hohe Messlatte, Einzelfallprüfung der Extraktionswahrscheinlichkeit. Ein unrechtmäßig trainiertes LLM bleibt unrechtmäßig trainiert.

</div>
<div style="flex: 50">

**Hamburger Diskussionspapier**

Das bloße Speichern eines LLM sei keine Speicherung personenbezogener Daten. Pflichten entstehen am Datenfluss (Input/Output/Training).

</div>
</div>

Lassen Sie diese Kontroverse **offen**, lösen Sie sie nicht auf. Für RAG laufen beide Positionen trotzdem auf dieselbe Praxis hinaus.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Personendaten gehören in den löschbaren Layer

Halten Sie personenbezogene Daten aus den **Modellgewichten** heraus und führen Sie sie nur im **adressierbaren, löschbaren Retrieval-Layer**.

## Filter sind keine Löschung

Eine verbreitete Fehlannahme: ein Output-Filter, der Namen schwärzt, erfülle die Löschpflicht. Die DSK widerspricht.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**DSK TOM-Guidance (Juni 2025)**: Input/Output-Filter sind eine **Übergangslösung** und "in sich keine Löschung". Guardrails ersetzen Löschpflichten **nicht**.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Das deckt sich mit dem Architekturprinzip aus den Sicherheitsquellen: **probabilistische** Maßnahmen (Filter, Klassifikatoren) müssen mit **deterministischen** kombiniert werden (Berechtigungen, delete-by-document-id).
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Ein Filter hat eine messbare Fehlerrate, eine Löschung entfernt den Eintrag deterministisch und nachweisbar. Verlassen Sie sich nur auf beides zusammen.

Konsequenz: Der Filter reduziert Risiko im laufenden Betrieb, aber die echte Löschung passiert auf der Datenebene (nächste Folien).
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Löschen: delete-by-doc-id / delete-by-metadata

Entwerfen Sie die Löschung am Tag 1. Voraussetzung ist eine **stabile Dokument-ID auf jedem Chunk**.

```python
# Beim Ingest: stabile ID + löschrelevante Metadaten an jeden Chunk
chunk_id = f"{doc_id}#{chunk_no}"          # z. B. "wartung_P12_2024-11#7"
metadata = {
    "doc_id": "wartung_P12_2024-11",
    "quelle": "wartungsprotokoll",
    "techniker_pseudonym": "T-0481",        # nicht der Klarname
    "erfasst_am": "2024-11-03",
}

# Löschantrag / Retention-Lauf:
index.delete(filter={"doc_id": "wartung_P12_2024-11"})   # delete-by-doc-id
index.delete(filter={"erfasst_am": {"$lt": "2022-01-01"}})  # by-metadata
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**delete-by-doc-id**: ein Betroffenenantrag oder ein zurückgezogenes Dokument entfernt alle zugehörigen Chunks in einem Schritt.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**delete-by-metadata**: Aufbewahrungsfristen als Filter, etwa alles vor einem Stichtag.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Dazu gehört zwingend **Deletion Detection und Sync**: was in der Quelle gelöscht wurde, muss auch aus dem Index verschwinden.
</div></script></section><section data-separator="

## Logisches vs. physisches Löschen

Ein Delete-Aufruf bedeutet nicht sofort, dass die Vektoren physisch weg sind. Das ist für Auskunfts- und Löschnachweise relevant.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Logisch**: der Eintrag verschwindet aus den Suchergebnissen (Tombstone), die Daten liegen physisch noch vor.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Physisch**: die Vektoren sind tatsächlich vom Datenträger entfernt.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Beispiel Weaviate**: Cassandra-inspirierte **Tombstones**. Das Objekt verlässt die Ergebnisse sofort, die Vektoren werden aber erst durch periodisches, asynchrones HNSW-Cleanup physisch entfernt.

> [!warning]
> Pinecone dokumentiert Löschen **per ID** und **per Metadatenfilter**, inzwischen auch für Serverless-Indizes; Delete-by-ID bleibt die effizienteste Variante für gezielte Löschungen.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Retention & ACL-Staleness

Zwei Zeitfenster, die im Design dokumentiert sein müssen, sonst entstehen stille Compliance-Lücken.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Retention**: Aufbewahrungsfristen pro Quelltyp definieren (z. B. Wartungsprotokoll N Jahre, Chatlog kurz) und als periodischen `delete-by-metadata`-Lauf umsetzen. Zweckbindung beachten: ein Lern- oder Such-Log darf nicht zum Leistungsprofil werden.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**ACL-Staleness**: ACL-aware Retrieval trimmt zur Query-Zeit gegen Berechtigungs-Metadaten. Entzogene Rechte bleiben aber bis zum **nächsten ACL-Sync** wirksam.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Sichern Sie sich ab mit stabilen Chunk-IDs plus einem dokumentierten **"Staleness Budget"** als SLA (wie lange darf ein entzogenes Recht maximal nachwirken?).
</div></script></section><section data-separator="

## Tenant-Trennung & Rollen/Rechte

Anders als das Modell ist die Vektor-DB **granular zugriffskontrollierbar**. Das ist die von der DSK empfohlene technisch-organisatorische Maßnahme (TOM).

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Mandantentrennung**: getrennte Index-Bereiche oder Namespaces je Abteilung/Werk, damit Anfragen aus Werk A nicht die Wartungsprotokolle aus Werk B sehen.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Rollen-/Rechte-Konzept** für Vektor-DB-Bereiche: Lese-/Schreib-/Lösch-Rechte je Rolle, getrennt von der Anwendungslogik.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Query-Zeit-Trimming**: Berechtigungs-Metadaten am Chunk werden bei jeder Anfrage gegen die Nutzerrolle gefiltert.

Merksatz: Was beim Modell unmöglich ist (granulare Zugriffskontrolle), ist beim Retrieval-Layer Standard. Das ist ein zweites starkes Argument für RAG statt Fine-Tuning auf sensiblen Daten.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## DPIA: Datenschutz-Folgenabschätzung

Bei voraussichtlich **hohem Risiko** für Betroffene verlangt **Art. 35 DSGVO** eine Datenschutz-Folgenabschätzung (DPIA), **bevor** verarbeitet wird.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Wann**: u. a. umfangreiche Verarbeitung sensibler Daten oder systematische Überwachung. Ein interner Wissensassistent über Personaldaten kann darunterfallen, die Einstufung macht die DSB.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Inhalt**: Beschreibung der Verarbeitung, Notwendigkeits- und Verhältnismäßigkeitsprüfung, Risikobewertung, geplante Abhilfemaßnahmen; laut DSK-Orientierungshilfe zu RAG über alle Komponenten vom Retriever bis zum LLM.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Stellschrauben im RAG-Design**: **Datenminimierung** (nur nötige Felder indexieren), **Pseudonymisierung** (Techniker-Pseudonym statt Klarname), **Transparenz** (Nutzer wissen, dass und worauf der Assistent zugreift).

Legen Sie den DPIA-Status als Nachweis ans Release-Gate, neben Provenance und Lösch-Konzept.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Betriebsrat & Mitbestimmung

Ein interner Assistent über Wartungs- und Arbeitsdaten kann zur **Verhaltens- oder Leistungskontrolle geeignet** sein. Das löst Mitbestimmung aus.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**§ 87 Abs. 1 Nr. 6 BetrVG**: Mitbestimmung bei der Einführung und Anwendung technischer Einrichtungen, die zur **Überwachung** von Verhalten oder Leistung **geeignet** sind. Geeignetheit genügt, eine tatsächliche Überwachungsabsicht ist nicht nötig.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Eine **KI-Betriebsvereinbarung** ist praktisch Voraussetzung für den Inhouse-Einsatz: Zweck, zulässige Auswertungen, Logging-Umfang, Aufbewahrung, Ausschluss individueller Leistungsdashboards.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Früh einbinden**: Betriebsrat und Datenschutzbeauftragten vor dem Rollout, nicht danach.
</div></script></section><section data-separator="

## EU AI Act: was für den Wissensassistenten gilt

Neben der DSGVO greift die KI-Verordnung. Für einen internen Wissensassistenten sind vier Punkte relevant (Stand Oktober 2026):

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Art. 50 Transparenz** (gilt seit 2. August 2026, nicht verschoben): Nutzer müssen erkennen, dass sie mit einem KI-System interagieren, sofern es nicht offensichtlich ist. Für den Assistenten heißt das: Kennzeichnung in der Oberfläche.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Art. 4 KI-Kompetenz** (seit 2. Februar 2025): Betreiber sorgen für ausreichende Kompetenz der Personen, die das System bedienen und beaufsichtigen.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Hochrisiko (Anhang III)**: ein Assistent über Handbücher und Wartungsprotokolle ist in der Regel kein Hochrisiko-System. Sobald er für Leistungsbewertung oder Personalentscheidungen genutzt wird (Anhang III Nr. 4), ändert sich das; Brücke zur Mitbestimmung auf der vorigen Folie.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Fristen**: der Digital Omnibus (VO (EU) 2026/1744, in Kraft seit 27. Juli 2026) verschiebt die Hochrisiko-Pflichten für Anhang-III-Systeme auf den 2. Dezember 2027, für Produkte nach Anhang I auf den 2. August 2028.

> [!note]
> Die Einstufung treffen Rechtsabteilung und DSB, nicht das Entwicklerteam. Dokumentieren Sie Zweck und Nutzergruppe des Assistenten so, dass diese Einstufung nachvollziehbar ist.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Datensouveränität: Optionen

Wo die Daten liegen und wer sie verarbeitet, ist eine Compliance- und keine reine Technikfrage. Vertiefung in Teil II.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**On-Prem / lokal** (z. B. Ollama, eigene GPU): datenschutzstärkste Variante, Trade-off bei Aufwand und Modellqualität.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Souveräne EU-Anbieter**: z. B. STACKIT, IONOS, T-Systems oder Mistral; Anbieterübersicht in Teil II.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Cloud-APIs mit EU-Residenz und AVV**: Enterprise-Verträge mit EU-Data-Boundary, Vendor-Vorbehalte zur EU-externen Verarbeitung prüfen.

Für Wartungsdaten mit Klarnamen ist On-Prem oder ein souveräner EU-Anbieter der naheliegende Default; die Wahl gehört in die DPIA.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Provenance: Quelle & Version je Chunk

Speichern Sie an jedem Chunk, woher er stammt und in welcher **Version**. Damit können Sie zitieren, die Antwort nachverfolgen und sauber updaten.

```yaml
chunk_id: "handbuch_P12#42"
doc_id: "handbuch_P12"
doc_version: "Rev-C-2025-03"
quelle: "maschinen-handbuch"
vertrauensstufe: "freigegeben"      # vs. entwurf / extern
seite: 87
erfasst_am: "2025-03-14"
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Zitierbarkeit**: die Antwort verweist auf "Handbuch, Rev-C, S. 87", nicht auf einen anonymen Textschnipsel.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Audit**: bei regulierten Domänen muss nachvollziehbar sein, **welche Dokumentversion** eine Antwort gestützt hat.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Update-Logik**: ändert sich `doc_version`, werden die alten Chunks gezielt ersetzt (delete-by-doc-id, dann neu indexieren).
</div></script></section><section data-separator="

## Index-Versionierung hinter Alias (Blue/Green)

Jeder Wechsel des **Embedding-Modells** invalidiert **alle** Vektoren. Legen Sie den versionierten Index hinter einen stabilen **Alias**, dann vermeiden Sie Downtime und eine inkonsistente Mischung.

<img src="media/blue_green_reindex.svg" alt="" style="width: 70%; object-fit: fill">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Green** (v1) bleibt live, **Blue** (v2) wird im Hintergrund mit dem neuen Embedder voll reindexiert.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Erst nach bestandener Eval gegen das Goldset schwenkt der **Alias** atomar um; bei Problemen sofortiger Rollback auf v1.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Gehen Sie bei jedem Embedder-, Chunking- oder Distanz-Wechsel genauso vor.
</div></script></section><section data-separator="

## Datenqualität bei der Ingestion

Schlechte Quelldaten lassen sich nicht "weg-retrieven". Drei Defekte, die jeden Index langsam vergiften:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Dubletten**: dasselbe Handbuch in drei Ablagen erzeugt redundante Chunks und verzerrt die Top-k-Treffer. Gegenmittel: **Content-Hash-Dedup** beim Ingest.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Veraltete Dokumente**: Rev-A der Wartungsanleitung neben Rev-C führt zu widersprüchlichen Antworten. Gegenmittel: Versions-Metadaten plus Deletion Detection, alte Revisionen aktiv aussortieren.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Quell-Vertrauensstufen**: Entwurf, freigegeben, extern sauber trennen. Untrusted Quellen sind zugleich der Einfallsweg für RAG-Poisoning, also schon beim Ingest scannen und kennzeichnen.

Faustregel: Jede Compliance- und Qualitätsregel braucht ein **Metadatenfeld** am Chunk, sonst können Sie sie nicht automatisch durchsetzen.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Rechtsgrundlage** für Embedding/Index geklärt (Art. 6), DPIA-Bedarf (Art. 35) mit der DSB bewertet.

- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Löschung** entworfen: stabile doc_id, delete-by-doc-id/-metadata, Deletion Detection, logisch vs. physisch verstanden.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Retention & ACL-Staleness** mit SLA dokumentiert; Filter nicht mit Löschung verwechseln.

- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->**Provenance & Versionierung**: Quelle/Version je Chunk, Blue/Green-Reindex; Ingestion gegen Dubletten, Altstände, Vertrauensstufen abgesichert.

Transfer: Versehen Sie Ihre Chunks mit `doc_id`, `doc_version` und `vertrauensstufe` und sehen Sie einen `delete-by-doc-id`-Lauf vor.
