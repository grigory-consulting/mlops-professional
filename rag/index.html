                    const element = itemsToFit[item];

        function fitElement(element, start, end) {

            let size = (end + start) / 2;

                while (element.scrollHeight > element.offsetHeight) {

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }

## Lernziele & Roadmap

Nach diesem Teil können Sie:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Retrieval** und **Generierung** als getrennte Verantwortlichkeiten unterscheiden und wissen, was wo schiefgeht.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->die **RAG-Bausteine** als Pipeline beschreiben: ingestion, index, retrieval, prompting, answering.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->die typischen **Fehlerbilder** benennen und im Pipeline-Verlauf verorten.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->begründen, wann sich RAG lohnt und wann es kein guter Einstieg ist.

Durchgehendes Beispiel im ganzen Kurs: ein technischer **Wissensassistent** über Maschinen-Handbücher, Wartungsprotokolle und interne Wikis. Laufendes Objekt: eine **Hydraulikpumpe**.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Warum RAG: das Gedächtnisproblem des LLM

Ein LLM ist stark im **Transformieren** von Sprache (zusammenfassen, umformulieren, erklären), aber schwach im zuverlässigen **Speichern** von Fakten.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Knowledge-Cutoff:** Das Modell kennt nur, was bis zum Trainingsstichtag im Training war. Spätere Stände fehlen.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Interne Dokumente waren nie im Training:** Ihre Dokument, Ihre Protokolle, Ihre Handbücher tauchen in keinem öffentlichen Trainingskorpus auf.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Frei generierte Fachinhalte sind oft **plausibel, aber falsch** (Halluzination), gerade in sicherheitskritischen Domänen.

**Ansatz:** nicht das Modell neu trainieren, sondern die richtigen Stellen zur Laufzeit **abrufen** (Retrieval). Daten bleiben in der adressierbaren, löschbaren Retrieval-Schicht, nicht in den Modellgewichten.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## RAG-Prinzip in einem Satz

> [!important]
> **RAG heißt:** vor jeder Antwort die richtigen Stellen aus den eigenen Dokumenten holen und ausschließlich **belegt** antworten.

Zwei Konsequenzen, die den ganzen Kurs tragen:
<!-- .element: class="fragment" data-fragment-index="0" -->

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Die Antwort ist nur so gut wie die **abgerufenen Stellen**.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Jede Aussage trägt einen **Quellennachweis**, sonst gilt sie als ungedeckt.
</div></script></section><section data-separator="

## Retrieval und Generierung: zwei Verantwortlichkeiten

RAG zerfällt in zwei Aufgaben mit getrennten Fehlerquellen. Trennen Sie diese beiden, dann wissen Sie bei jedem Fehler, wo Sie suchen müssen.

<div class="two-col">
<div style="flex: 50">

**Retrieval: Finde ich die richtige Stelle?**

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Falscher oder überflüssiger Kontext gelangt in den Prompt.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Die relevante Stelle wird gar nicht gefunden.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Diagnose über IR-Metriken (Teil VII).

</div>
<div style="flex: 50">

**Generierung: Antwortet das Modell korrekt darauf?**
<!-- .element: class="fragment" data-fragment-index="4" -->

- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Korrekter Kontext wird falsch interpretiert.
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Das Modell ergänzt eigene, ungedeckte Behauptungen.
- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->Diagnose über Faithfulness/Citation-Quality (Teil VIII, IX).

</div>
</div>

OpenAIs Fehlerframework trennt genau so: **Retrieval-Probleme** (falscher/überflüssiger Kontext) gegenüber **Generierungs-Problemen** (korrekter Kontext, falsch verarbeitet).
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Die RAG-Pipeline: fünf Bausteine

<img src="media/rag_pipeline_fuenf_bausteine.svg" alt="" style="width: 95%; object-fit: fill">


**Ingestion** lädt und zerlegt Dokumente. Der **Index** speichert Embeddings durchsuchbar. **Retrieval** holt zur Frage die passenden Chunks. **Prompting** baut daraus das Kontext-Paket. **Answering** erzeugt die belegte Antwort.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Zwei Phasen: Indexierung gegenüber Abruf

Der wichtigste Architektur-Schnitt: die teure Vorbereitung von der schnellen Anfrage trennen.

| Phase | Wann | Kosten | Ergebnis |
|---|---|---|---|
| **Indexierung** | einmalig oder periodisch | hoch (chunken, embedden, speichern) | durchsuchbarer Index |
| **Abruf** | bei jeder Anfrage | niedrig (suchen, prompten, antworten) | belegte Antwort |

**Update:** Ändert sich ein Handbuch, wird nur das **einzelne Dokument** neu indexiert (neu chunken, neu embedden, alte Chunks ersetzen). Kein Re-Training, kein vollständiger Neuaufbau.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Fehlerbilder: Ursache und Ort in der Pipeline

| Fehlerbild | Ursache | Ort in der Pipeline |
|---|---|---|
| **Halluzination** | Modell antwortet ohne Deckung durch den Kontext | Answering |
| **Falsches Grounding** | richtiger Chunk, falsch gelesen/verknüpft | Answering |
| **Fehlender Recall** | Embedding/Chunking trifft die Stelle nicht | Retrieval / Index |
| **Lost in the Middle** | relevante Stelle liegt in der Mitte des Kontexts | Prompting |
| **Veraltete Version** | alter Stand nicht ersetzt, Sync fehlt | Ingestion / Index |

**Lost in the Middle** (Liu et al., TACL 2024): bei den 2023 untersuchten Modellen ist die Trefferqualität am höchsten, wenn die relevante Information am **Anfang oder Ende** des Kontexts steht, und fällt in der Mitte ab. Neuere Modelle leiden weniger unter der Position als unter Länge und Distraktoren (Chroma, Context Rot, 2025). Konsequenz bleibt: wenige starke Chunks, die stärksten an die Ränder.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Beispiel: Quelle, Auszug, Mapping

Der Wissensassistent indexiert das Wartungshandbuch der Hydraulikpumpe. Ein Chunk wird mit stabiler ID und Metadaten gespeichert (illustratives Beispiel):

```yaml
chunk_id: "handbuch-p12-rev4#0042"
doc_id: "handbuch-p12"
version: "Rev. 4"
seite: 37
abschnitt: "5.3 Pumpenkopf montieren"
text: >
  Die Schrauben des Pumpenkopfs sind über Kreuz mit
  einem Anzugsmoment von 45 Nm anzuziehen. Vor der
  Montage die Dichtflächen reinigen.
```

Die **stabile ID** (`doc_id#chunk_no`) ist die Klammer für alles Spätere: Quellennachweis, gezieltes Update und gezieltes Löschen hängen an ihr.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Beispiel: Grounding-Regel und belegte Antwort

**Grounding-Regel** im System-Prompt: Antworte ausschließlich aus den gelieferten Chunks. Fehlt die Information, sage das. Jede Aussage bekommt die `chunk_id` als Beleg.

```text
Frage:  Mit welchem Anzugsmoment werden die
        Pumpenkopf-Schrauben der P-12 angezogen?

Antwort: 45 Nm, über Kreuz angezogen. Vor der Montage
         die Dichtflächen reinigen.
         Quelle: handbuch-p12-rev4#0042 (S. 37, Rev. 4)
```

Steht die Information in keinem Chunk, lautet die korrekte Antwort **"nicht gefunden"**, nicht eine geratene Zahl. Lassen Sie das System "weiß ich nicht" sagen dürfen: das ist genau dann gewollt, wenn die Quelle schweigt.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Warum RAG keine Black Box ist

Bei RAG können Sie an jeder Stufe nachsehen, was passiert: Sie schauen nicht in eine geschlossene Box.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Quellennachweis:** Jede Aussage zeigt auf eine konkrete Stelle (Chunk-ID, Seite, Version).
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Protokollierung:** Frage, abgerufene Chunks und Antwort sind nachvollziehbar mitschreibbar.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Erlaubte Nicht-Antwort:** "nicht gefunden" ist ein definierter, geprüfter Ausgang.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Update ohne Re-Training:** falscher oder veralteter Stand wird durch Neu-Indexieren des Dokuments korrigiert.

Das ist der Unterschied zwischen "das Modell behauptet" und "das System belegt".
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Wann RAG lohnt, wann nicht

<div class="two-col">
<div style="flex: 50">

**Guter Einstieg**

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->wiederkehrende **Wissensarbeit** (dieselben Fragetypen)
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Inhalte liegen **digital** vor
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->konkrete, benennbare **Nutzergruppe**
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->ein **Fachbereichs-Owner** pflegt den Korpus
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->großer oder **volatiler** Korpus, Quellenpflicht

</div>
<div style="flex: 50">

**Kein guter Einstieg**
<!-- .element: class="fragment" data-fragment-index="6" -->

- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->**Entscheidungen automatisieren** ohne Mensch im Loop
- &shy;<!-- .element: class="fragment" data-fragment-index="8" -->**Profiling** von Personen
- &shy;<!-- .element: class="fragment" data-fragment-index="9" -->**HR-Daten** und vergleichbar sensible Bestände
- &shy;<!-- .element: class="fragment" data-fragment-index="10" -->Aufgaben, die ein gutes Notizsystem schon löst

</div>
</div>

> [!warning]
> RAG hilft nicht automatisch: In einem dokumentierten OpenAI-Beispiel (Text-to-SQL) **senkte** das Nachladen ähnlicher Beispiele per Retrieval (dynamisches Few-Shot) den BLEU-Score eines mit 1000 Beispielen feinabgestimmten GPT-4-Modells von 87 auf 83; OpenAI führt das auf zusätzliches Rauschen im Kontext zurück. Messen Sie den Effekt, bevor Sie ihn voraussetzen.
>
> Quelle: [OpenAI API Docs, *Optimizing LLM Accuracy*](https://developers.openai.com/api/docs/guides/optimizing-llm-accuracy#rag--fine-tuning), Abschnitte "Fine-tuning" und "RAG + Fine-tuning";

## Realistische Einsatzfelder

Alle Felder teilen dasselbe Muster: **faktenbasierte Fragen** an einen gepflegten Dokumentenbestand.

| Feld | Korpus | Typische Frage |
|---|---|---|
| **Compliance** | Richtlinien, Normen, Verträge | "Welche Aufbewahrungsfrist gilt für X?" |
| **Service** | Handbücher, Tickets, FAQ | "Wie behebe ich Fehlercode E-17?" |
| **Produktion** | Wartungsprotokolle, Arbeitsanweisungen | "Anzugsmoment Pumpenkopf?" |
| **Behörde** | Verwaltungsvorschriften, Formulare | "Welche Unterlagen für Antrag Y?" |
</div></script></section><section data-separator="

## Recap & Transfer

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->RAG holt **vor** der Antwort die richtigen Stellen und antwortet **belegt**: Retrieval statt Re-Training.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Zwei Verantwortlichkeiten:** Retrieval (richtige Stelle finden) und Generierung (korrekt darauf antworten), getrennt diagnostizierbar.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Pipeline:** ingestion, index, retrieval, prompting, answering, gespalten in teure Indexierung und schnellen Abruf.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Fünf Fehlerbilder** mit klarem Ort: Halluzination, falsches Grounding, fehlender Recall, Lost in the Middle, stale.
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->RAG ist **keine Black Box**: Quellen, Protokoll, erlaubte Nicht-Antwort, Update ohne Re-Training.

**Transfer:** Im nächsten Teil wählen wir das **LLM** für die Answering-Stufe aus (Kontextfenster, Kosten/Latenz, On-Prem gegenüber Cloud) und entscheiden über Antwortformate.

## Lernziele und Roadmap

Nach diesem Teil können Sie ein LLM für RAG begründet auswählen und die Trade-offs aus Kosten, Latenz und Kontext einschätzen.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Auswahlkriterien** für das Generator-LLM systematisch durchgehen.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Kontextfenster** verstehen: beworbene gegen nutzbare Länge.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Long-Context gegen RAG** als Architekturentscheidung einordnen.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Kosten** in Vielfachen rechnen statt in Tagespreisen (Caching, Batch).
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Antwortformate** auswählen: Structured Outputs oder API-Citations.
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->**On-Prem gegen Cloud** und Datensouveränität abwägen.
</div></script></section><section data-separator="

## Auswahlkriterien für das Generator-LLM

Sechs Achsen, die jede Modellwahl bestimmen:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Qualität**: Faithfulness und Reasoning auf der eigenen Domäne, nicht nur Leaderboard-Werte.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Kontextlänge**: wie viele Chunks plus Präambel passen verlässlich hinein (siehe nächste Folie).
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Kosten**: Input- und Output-Token-Preise, multipliziert mit dem Anfragevolumen.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Latenz**: Antwortzeit bis zum ersten Token und bis zur vollständigen Antwort.
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Datensouveränität**: dürfen proprietäre Handbücher und Wartungsprotokolle das Haus verlassen.
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->**Multimodalität**: braucht der Assistent Bilder, Schaltpläne oder Tabellenseiten direkt im Kontext.

Für unseren Assistenten kollidieren oft **Qualität** und **Datensouveränität**: das stärkste Cloud-Modell gegen ein lokales Modell auf eigenen GPUs.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Kontextfenster: beworben gegen nutzbar

Die beworbene Kontextlänge ist nicht die nutzbare Kontextlänge.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**RULER (NVIDIA, 2024)**: die meisten Modelle fallen unter eine Leistungsschwelle, **bevor** sie ihre beworbene Länge erreichen.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Databricks-Mosaic (2024)** (20 LLMs, Kontexte von 2k bis 128k Token, bis 2 Mio. wo möglich): die meisten Modelle verbessern sich zunächst und **degradieren** dann mit wachsendem Kontext. Nur wenige **Frontier-Modelle** halten ihre Accuracy oberhalb von **64k Token**.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Context Rot (Chroma, 2025)**, 18 Modelle von Claude 4 über GPT-4.1 und Gemini 2.5 bis Qwen3: die Leistung sinkt mit der Eingabelänge auch bei trivialen Aufgaben, und Distraktoren wirken umso stärker, je länger der Kontext ist.

> [!warning]
> Kontextlänge ist ein modellabhängiges Auswahlkriterium. **Messen** Sie die nutzbare Länge auf der eigenen Domäne, nehmen Sie sie nicht an.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Lost in the Middle und Kontext-Befüllung

**Lost in the Middle** (Liu et al., TACL 2024, gemessen an Modellen von 2023): die Genauigkeit ist am höchsten, wenn die relevante Information am **Anfang** oder am **Ende** des Kontextes steht, und fällt in der Mitte ab.

<div class="two-col">
<div style="flex: 55">

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Die Kurve ist U-förmig: Ränder werden besser genutzt als die Mitte.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Bei aktuellen Modellen ist der Positionseffekt klein (Context Rot, 2025); der Längeneffekt bleibt.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Konsequenz für RAG: die **stärksten** Chunks gehören an die Enden des Kontextes.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Ein **Reranker** kuratiert genau diese Reihenfolge (Detail in Teil VI).
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Mehr Chunks sind nicht besser: knappes, gut sortiertes Top-k schlägt ein volles Fenster.

</div>
<div style="flex: 45">

<img src="media/lost_in_the_middle_konzept.svg" alt="" style="width: 100%; object-fit: fill" class="fragment">


</div>
</div>

Im Beispiel: das einschlägige Wartungsprotokoll an Position 1 oder zuletzt, nicht vergraben zwischen 40 mittelmäßigen Treffern.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Long-Context gegen RAG

Zentrale Studie (Li et al., Google DeepMind, EMNLP 2024; Modellstand 2024: Gemini-1.5-Pro, GPT-4o, GPT-3.5-Turbo):

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Long-Context (LC)** schlägt RAG im Schnitt, **wenn** die Ressourcen reichen.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Für die meisten Anfragen liefern beide dasselbe Ergebnis: **63 %** exakt identische Vorhersagen.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**RAG bleibt der günstige Standardpfad**: weniger Input-Token, häufig gleiche Antwort.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Self-Route nutzt nur **38,39 % / 61,40 % / 38,85 %** der LC-Token (Gemini-1.5-Pro / GPT-4o / GPT-3.5), also verbraucht reines LC etwa **2,6x / 1,6x / 2,6x** so viele Tokens.

**Self-Route-Hybrid**: das Modell prüft zuerst selbst, ob die abgerufenen Chunks reichen, und reicht nur unbeantwortbare Anfragen an Long-Context weiter. Die Studienautoren berichten **65 %** (Gemini-1.5-Pro) und **39 %** (GPT-4o) Kostensenkung bei nahezu LC-Qualität. Folgestudien (2025) kommen zu gemischten Ergebnissen; Konsens ist das Routing zwischen beiden Pfaden.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Self-Route: RAG zuerst, Long-Context nur bei Bedarf

<img src="media/self_route.svg" alt="" style="width: 80%; object-fit: fill">


Die günstige RAG-Stufe beantwortet die meisten Anfragen. Nur die schweren Fälle zahlen den Long-Context-Aufschlag. So kombinieren Sie reines RAG und reines LC, ohne für jede Anfrage den vollen Preis zu zahlen.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Kosten in Vielfachen rechnen

Absolute Token-Preise sind volatil. Vermitteln Sie deshalb die **Stellschrauben**, denn die Tagespreise ändern sich laufend.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Input- gegen Output-Token**: Output ist pro Token meist deutlich teurer als Input.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Prompt-Caching**: eine wiederholte Präambel (System-Prompt, Instruktionen, Few-Shots) wird zwischengespeichert. Ein Cache-Treffer kostet rund **0,1x** des Input-Preises (neueste Anthropic-Modelle: 0,05x bis 0,025x), also bis zu **etwa 90 %** Ersparnis auf dem wiederholten Anteil. Der Cache-Write kostet **1,25x** (5 Minuten TTL) oder **2x** (1 Stunde); ab der zweiten Anfrage innerhalb der TTL lohnt es sich. Mindestlänge des Präfix ist modellabhängig (512 bis 4.096 Tokens).
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Batch-Verarbeitung**: nicht latenzkritische Läufe (z. B. Re-Indexierung, Offline-Evals) erhalten rund **50 % Rabatt**.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Embedding-Modell-Varianten**: kleinere Dimension senkt Speicher- und Suchkosten im Index.

> [!tip]
> Stabile Präambel **zuerst**, variable Frage **zuletzt**: nur so greift das Caching auf dem gemeinsamen Präfix.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Rechenbeispiel: 1000 Anfragen

Annahme: 1.000 Anfragen, je etwa **2.000 Token Kontext** (Input) und etwa **300 Token Antwort** (Output).

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Volumen: **2,0 Mio** Input-Token plus **0,3 Mio** Output-Token.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Davon sind etwa **1.500 Token** je Anfrage eine **fixe Präambel**, nur **500 Token** variieren.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Mit Prompt-Caching** (Anthropic per `cache_control`, OpenAI automatisch) auf der Präambel: der wiederholte Anteil (1,5 Mio Token) kostet beim Cache-Read nur rund **0,1x**, dazu der Cache-Write mit 1,25x, bei laufendem Verkehr innerhalb der TTL nur einmal. Die Einsparung liegt fast vollständig auf diesem Block.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Mit OpenAI Batch** zusätzlich rund **50 %** gegenüber synchronen API-Aufrufen auf den dafür geeigneten Token-Kosten.

Kombiniert sinken die Kosten gegenüber dem naiven Lauf deutlich, ohne Qualitätsverlust. Konkrete Eurobeträge prüfen Sie live gegen die aktuellen Anbieterpreise; hier zeigen wir nur die dokumentierten Multiplikatoren.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Latenz-Stellschrauben

Latenz können Sie gezielt steuern. Vier Stellschrauben:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Modellgröße**: kleinere Modelle antworten schneller (siehe Drei-Stufen-Auswahl).
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Kontextlänge**: jeder zusätzliche Chunk kostet Verarbeitungszeit. Knappes Top-k hilft Latenz und Qualität zugleich.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Reranking-Stufe**: ein Cross-Encoder-Rerank vor dem LLM kostet eigene Zeit, reduziert aber den Kontext und damit die Generationszeit.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Streaming**: Token werden ausgegeben, sobald sie entstehen. Die wahrgenommene Wartezeit sinkt, auch wenn die Gesamtdauer gleich bleibt.
</div></script></section><section data-separator="

## Antwortformate: Structured Outputs gegen Citations

Zwei Wege, eine Antwort maschinenlesbar oder belegbar zu machen:

<div class="two-col">
<div style="flex: 50">

**Structured Outputs**

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ein **JSON-Schema** erzwingt die **Syntax** der Ausgabe.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Garantiert gültiges JSON, **nicht** die semantische Korrektheit der Werte.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Gut für downstream-Verarbeitung (Felder, Status, Score).

</div>
<div style="flex: 50">

**API-Citations** (z. B. Anthropic)
<!-- .element: class="fragment" data-fragment-index="4" -->

- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Liefert **garantiert gültige Quellenzeiger** in die übergebenen Dokumente, keine erfundenen Zitate.
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->`cited_text` kostet keine zusätzlichen Output-Token.
- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->Gut für Nachvollziehbarkeit in unserem Assistenten.

</div>
</div>

> [!warning]
> Die Citations API ist **inkompatibel** mit Structured Outputs (die Kombination liefert einen **400-Fehler**). Pro Aufruf gilt: **Schema ODER API-Citations**, nicht beides.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## On-Prem gegen Cloud

Die Plattformwahl folgt aus Datenschutz, Volumen und Hardware:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Ollama**: lokales Modell-Serving, kostenlos, einfacher Einstieg für datensouveräne Umgebungen.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**vLLM**: hoher Durchsatz auf GPUs (Paged-Attention), Batch- und Self-Hosting-Pfad für offene Modelle (gpt-oss, Qwen3, Llama 4, Gemma 3, Mistral Small).
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Europäische API-Anbieter**: Mistral (La Plateforme), STACKIT, IONOS, T-Systems als Alternative zu US-Cloud-APIs.

**Szenario**: proprietäre Handbücher plus ein Datenschutz-Hard-Stop ergeben einen klaren Schluss: ein **lokales Modell** (Ollama im Pilot, vLLM für Last) statt einer externen API.
<!-- .element: class="fragment" -->

## Datensouveränität: ein Stufenmodell

Von schwächster zu stärkster Datenschutzkontrolle:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**EU Data Boundary** (z. B. M365 Copilot): mit **Vorbehalt** EU-externer Verarbeitung bei Spitzenlast oder bestimmten Modellen.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Enterprise-AVV mit EU-Residenz** (z. B. OpenAI Enterprise: AVV, Zero Data Retention, EU-Residenz seit 2/2025).
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Souveräne EU-Anbieter**: STACKIT AI Model Serving (Schwarz-Gruppe), IONOS AI Model Hub, T-Systems AI Foundation Services, mittwald, Mistral; für Behörden "OpenAI for Germany" über die SAP-Tochter Delos Cloud (angekündigt 2025).
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**On-Prem / lokale Open-Source-LLMs**: die **datenschutz-stärkste** Variante, Trade-off bei Aufwand und Qualität.

## Modellgrößen, Hardware und Eignung

Grobe Faustregeln für offene Modelle (fp16-Gewichte grob **2 Byte pro Parameter**; KV-Cache, Kontextlänge, Framework-Overhead und Parallelisierung kommen hinzu):

| Klasse | Eignung | Hardware (grob) |
|--------|---------|-----------------|
| **1 bis 4B** | Routing, Klassifikation, Feld-Extraktion | CPU oder kleine GPU, etwa 2 bis 8 GB RAM/VRAM |
| **7 bis 14B** | belegte RAG-Standardantworten | eine GPU, etwa 14 bis 28 GB (fp16) |
| **30 bis 70B** | anspruchsvolles Reasoning, Synthese | Multi-GPU / Server, etwa 60 bis 140 GB (fp16) |

**Quantisierung**: 4-Bit (Q4) senkt die reine Gewichtsgröße grob auf ein Viertel gegenüber fp16. Praktisch zählen zusätzlich KV-Cache und Laufzeit-Overhead, deshalb konkrete Modelle immer mit Model-Card oder Memory-Estimator prüfen. Bei MoE-Modellen (z. B. gpt-oss-20b: 21B Parameter gesamt, 3,6B aktiv) richtet sich der Speicher nach den Gesamt-, die Geschwindigkeit nach den aktiven Parametern.

## Modellwahl für unseren Assistenten

Alle Achsen zusammengeführt am laufenden Beispiel:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Datenschutz-Hard-Stop** auf proprietären Handbüchern: Cloud-API fällt aus, lokal ist gesetzt.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Hardware** vorhanden: eine bis zwei GPUs, also Klasse **7 bis 14B** quantisiert als Generator.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Routing/Extraktion** an ein **1-bis-4B-Modell**, Standardantworten an das mittlere Modell.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Kontext** knapp halten, wichtigste Chunks an die Enden (Lost in the Middle).
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Belegbarkeit**: Quellenzeiger pro Aussage, hier über das Prompt-Muster (lokale Modelle ohne Citations API, Detail in Teil III).
</div></script></section><section data-separator="

## Recap und Transfer

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Beworbene Kontextlänge ist nicht nutzbare Kontextlänge: **messen** (RULER, Databricks, Context Rot).
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Wichtigste Chunks an die **Ränder** des Kontextes (Lost in the Middle).
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Self-Route**-Hybrid: RAG für die Masse, Long-Context nur für harte Fälle.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Kosten in **Multiplikatoren** denken: Prompt-Caching (Treffer bis \~90 %, Write 1,25x), Batch (\~50 %).
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Pro Aufruf: **Schema ODER API-Citations**, nicht beides (400-Fehler).
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Datensouveränität als Stufenmodell, On-Prem als stärkste Variante.

**Transfer**: Skizzieren Sie für den eigenen Korpus die Modellauswahl entlang der sechs Achsen und ordnen Sie eine Stufe (klein / mittel / frontier) pro Anfragetyp zu.

## Lernziele & Roadmap

Nach diesem Teil können Sie **RAG-Prompts** mit Rollen, Templates und **nachprüfbarer Quellenattribution** bauen.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**System-Prompt:** Rolle und Grenzen so setzen, dass das Modell aus dem gelieferten Kontext antwortet und nicht aus dem Vortraining.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Template-Anatomie:** System, Kontext, Frage, Anweisung als feste Bausteine, mit konkretem deutschen Beispiel.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Quellenattribution:** Prompt-basierte Zitate vs. API-Citations, und warum beide gemessen werden müssen (ALCE).
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Antwortformate:** knappe belegte Antwort vs. strukturiertes JSON.
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Refusal:** "Weiß nicht" als bewusste, messbare Strategie.
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->**Kontext-Hygiene:** High-Recall-Paradox, Reihenfolge gegen Lost in the Middle, Anti-Patterns.
</div></script></section><section data-separator="

## System-Prompt: nur aus dem Kontext antworten

Der System-Prompt definiert **Rolle** und **Grenzen**. Die entscheidende Grenze in RAG: das Modell soll **ausschließlich den gelieferten Kontext** verwenden, nicht sein Vortraining.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Warum das nicht selbstverständlich ist:** Ein Modell übernimmt unbelegte Aussagen, die es zufällig aus dem Vortraining kennt. Der Prompt muss deshalb ausdrücklich anweisen, **nur gegen den bereitgestellten Kontext** zu antworten.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Rolle konkret:** "technischer Wartungsassistent für Maschinen-Handbücher, Wartungsprotokolle und interne Wikis", nicht "hilfreicher Allzweck-Assistent".
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Grenzen konkret:** kein Vortrainingswissen, jede Aussage belegt, bei fehlender Abdeckung Refusal (spätere Folie).

> [!note]
> Dieselbe Regel gilt für den **Judge** in der Evaluation: Er bewertet nur gegen den Kontext, sonst winkt er Halluzinationen durch, die zufällig zu seinem Vortrainingswissen passen. Mehr dazu in Teil VIII (Evaluation).
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Anatomie eines RAG-Prompt-Templates

Vier feste Bausteine, in dieser Reihenfolge. Jeder hat genau eine Aufgabe.

<img src="media/prompt_template_anatomie.svg" alt="" style="width: 50%; object-fit: fill">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**System:** Rolle plus harte Grenzen (nur Kontext, immer belegen).
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Kontext:** die abgerufenen Chunks, jeder mit einer stabilen **Quellen-ID**.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Frage:** die unveränderte Nutzeranfrage.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Anweisung:** Ausgabeformat, Belegpflicht, Refusal-Erlaubnis.
</div></script></section><section data-separator="

## Konkretes Template

```text
[SYSTEM]
Sie sind ein technischer Wartungsassistent für Maschinen-Handbücher,
Wartungsprotokolle und interne Wikis. Beantworten Sie Fragen
AUSSCHLIESSLICH auf Basis des bereitgestellten Kontexts.
Nutzen Sie KEIN Wissen aus Ihrem Vortraining.
Wenn der Kontext die Antwort nicht hergibt, antworten Sie exakt:
"Nicht aus den Quellen belegbar."

[KONTEXT]
[Q1] (handbuch-p12.pdf, S. 47): Der Solldruck der Hydraulikpumpe P-12
liegt im Betrieb bei 180 bar (Toleranz +/- 5 bar).
[Q2] (wartungsprotokoll-2026-03.md): Bei Druckabfall unter 150 bar
ist der Dichtungssatz DS-12 zu prüfen.

[FRAGE]
Welcher Betriebsdruck ist für die Pumpe P-12 vorgesehen?

[ANWEISUNG]
- Antworten Sie knapp und nur aus dem Kontext.
- Belegen Sie jede Aussage mit der Quellen-ID in eckigen Klammern, z. B. [Q1].
- Geben Sie keine Aussage ohne Beleg aus.
```
</div></script></section><section data-separator="

## Kontext-Block: Chunks mit Quellen-IDs

Belege müssen Sie von Anfang an mitführen. Jeder Chunk bekommt schon beim Abrufen eine ID und behält sie bis in die fertige Antwort.

```yaml
- id: Q1
  quelle: handbuch-p12.pdf
  stelle: "S. 47"
  text: "Der Solldruck der Hydraulikpumpe P-12 liegt bei 180 bar."
- id: Q2
  quelle: wartungsprotokoll-2026-03.md
  stelle: "Eintrag 12"
  text: "Bei Druckabfall unter 150 bar Dichtungssatz DS-12 prüfen."
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Stabile IDs** (z. B. `{doc_id}#{chunk_no}`): dieselben IDs brauchen Sie später fürs Löschen und für Rechte-Filter, vergeben Sie sie also gleich konsequent.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Stelle mitgeben** (Seite, Abschnitt, Eintrag): nur damit kann jemand den Beleg wirklich nachschlagen, nicht bloß das Modell.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Fehlen die IDs hier, rät sich das Modell die Quellen am Ende zusammen.
</div></script></section><section data-separator="

## Antwortformate steuern

Das Ausgabeformat wird in der **Anweisung** festgelegt. Zwei typische Modi für unseren Assistenten:

<div class="two-col">
<div style="flex: 50">

**Knappe belegte Antwort**

```text
Der Betriebsdruck der Pumpe P-12
liegt bei 180 bar (Toleranz
+/- 5 bar) [Q1].
```
Für Menschen am Bildschirm. Quellen-IDs inline.

</div>
<div style="flex: 50">

**Strukturiertes JSON**

```json
{
  "antwort": "180 bar (+/- 5 bar)",
  "belege": ["Q1"],
  "abgedeckt": true
}
```
Für nachgelagerte Systeme, Tickets, Dashboards.

</div>
</div>

> [!warning]
> Structured-Output- und JSON-Modi garantieren **gültige JSON-Syntax**, nicht die **semantische Korrektheit** der Werte. Ein valides `"belege": ["Q1"]` heißt nicht, dass Q1 die Aussage wirklich stützt.
</div></script></section><section data-separator="

## "Weiß nicht" als Prompt-Strategie

Manchmal ist "Weiß nicht" die richtige Antwort. Der Prompt muss sie **ausdrücklich erlauben und verlangen**, sonst erfindet das Modell lieber etwas, als die Lücke zuzugeben.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Ausdrücklich erlauben:** "Wenn der Kontext die Antwort nicht hergibt, antworten Sie exakt: `Nicht aus den Quellen belegbar.`"
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Eine feste Formel vorgeben:** immer derselbe Satz, dann können Sie die Verweigerungen später automatisch zählen.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Bei schwachen Treffern lieber abbrechen:** ein fehlender Beleg ist besser als ein erfundener.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Jede Aussage einordnen:** supported, unsupported, contradicted oder insufficient. Bei "insufficient" ist "Weiß nicht" die richtige Ausgabe.
</div></script></section><section data-separator="

## Refusal & Grounding messbar machen

Eine Refusal-Strategie nützt nur, wenn Sie sie messen. Zwei Kennzahlen gehören ins Eval-Set.

| Metrik | Was sie misst | Ziel |
|---|---|---|
| **Unsupported-Claim-Rate** | Anteil Aussagen ohne deckenden Beleg im Kontext | möglichst niedrig |
| **Refusal-Accuracy** | Refusal genau dann, wenn der Kontext wirklich nicht deckt | hoch (kein Over- und kein Under-Refusal) |

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**No-Answer-Fälle** gehören bewusst ins Goldset: Fragen, die der Korpus nicht beantwortet, mit erwarteter Antwort "Refusal".
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Zwei Fehlerrichtungen:** Over-Refusal (verweigert trotz Abdeckung) frustriert; Under-Refusal (antwortet trotz Lücke) halluziniert.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Diese Metriken messen **Grounding** getrennt von der Antwortqualität, wie der übrige Eval-Stack auch. Mehr dazu in Teil VIII (Evaluation).
</div></script></section><section data-separator="

## High-Recall-Paradox

Mehr abgerufene Chunks sind nicht automatisch besser. **Überflüssiger Kontext** gilt als eigener Retrieval-Fehler.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->OpenAIs Accuracy-Framework trennt RAG-Fehler in **Retrieval-Probleme** (falscher oder überflüssiger Kontext) und **Generation-Probleme** (richtiger Kontext falsch verarbeitet).
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Dokumentierter Fall (OpenAI, Text-to-SQL): das **Nachladen ähnlicher Beispiele** per Retrieval zu einem feinabgestimmten Modell **senkte** den BLEU-Score von 87 auf 83, weil der zusätzliche Kontext Rauschen brachte. Mehr Kontext hilft also nicht in jedem Fall.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Mechanismus:** Distraktoren im Kontext senken die Genauigkeit messbar (Context Rot, 2025). In der Praxis zeigt sich das als **erfundene Aggregation** ("im Schnitt 160 bar"), die in keiner einzelnen Quelle steht.

> [!tip]
> Geben Sie lieber wenige, hochrelevante Chunks (per Reranking, kleines `k`) als einen vollen Kontext, in dem die richtige Stelle untergeht.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Kontext-Reihenfolge gegen Lost in the Middle

**Lost in the Middle** (eingeführt in Teil II): An den **Rändern** des Kontexts wird Information besser genutzt als in der Mitte.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Konsequenz für das Prompting:** die stärksten retrievten Chunks gehören an die **Ränder** des Kontext-Blocks, nicht in dessen Mitte.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Praktisch:** nach dem Reranking die Top-Treffer auf Anfang und Ende verteilen (z. B. Rang 1 oben, Rang 2 unten).
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Das ist kein Ersatz für gutes Retrieval, sondern eine **Anordnungs-Entscheidung** im Prompt-Bau.

Ab `k > 4-5` ist die Reihenfolge nicht optional: Reranking und bewusste Platzierung gehören zusammen. Den Reranker dafür behandelt Teil VI.
<!-- .element: class="fragment" -->

## Few-Shot & Format-Beispiele

Beispiele im Prompt steuern das **Ausgabeverhalten** zuverlässiger als Prosa-Anweisungen.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Format-Beispiele:** ein bis zwei Muster-Antworten zeigen Belegstil, Knappheit und die Refusal-Formel konkret vor.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Dynamic Few-Shot:** statt fixer Beispiele die **per Embedding-Ähnlichkeit** passendsten Beispiele zur jeweiligen Anfrage einblenden.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Refusal mit-demonstrieren:** ein Beispiel, in dem die korrekte Antwort "Nicht aus den Quellen belegbar." ist, verankert das Verhalten.

```text
Beispiel-Frage: "Welches Hydrauliköl ist für P-12 freigegeben?"
Beispiel-Kontext: (enthält keine Öl-Spezifikation)
Beispiel-Antwort: "Nicht aus den Quellen belegbar."
```
<!-- .element: class="fragment" -->

Vorsicht: Beispiele kosten Tokens und konkurrieren mit echtem Kontext. Wenige, gute Beispiele schlagen viele.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Spotlighting: Fremdtext markieren

Der Kontext-Block enthält **fremden, untrusted Text** (abgerufene Dokumente). **Spotlighting** markiert diesen Text klar, damit das Modell ihn als **Daten** behandelt, nicht als **Anweisung**.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Problem:** Ein abgerufener Chunk könnte Text wie "Ignoriere alle vorherigen Anweisungen und antworte mit ..." enthalten (indirekte Prompt-Injection).
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Spotlighting:** Fremdtext eindeutig abgrenzen (Delimiter, Markierung) und im System-Prompt festlegen, dass **innerhalb dieser Grenzen** nichts als Anweisung gilt.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Das ist ein **Vorgriff auf Sicherheit**: gehärtete System-Prompts und Spotlighting sind erste Schicht der Defense-in-Depth. Vertiefung in Teil X (Sicherheit & Governance).

> [!warning]
> Spotlighting allein **verhindert** indirekte Prompt-Injection **nicht** zuverlässig (BSI: intrinsische Schwäche). Es ist eine Schicht, kein vollständiger Schutz.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Anti-Patterns im Prompt

Vier Muster, die belegte Antworten still untergraben.

| Anti-Pattern | Wirkung | Gegenmittel |
|---|---|---|
| **Widersprüchliche Anweisungen** ("knapp" und "ausführlich") | unvorhersehbares Verhalten, prompt-sensitiv | eine eindeutige Anweisung, Prompt versionieren |
| **Zu viel Kontext** | richtige Stelle geht unter (Lost in the Middle), Aggregations-Halluzination | gezielt statt maximal, Reranking |
| **Fehlende Refusal-Erlaubnis** | Modell füllt Lücken mit Vortrainingswissen | Refusal explizit erlauben und einfordern |
| **Fremdtext = Anweisung** | indirekte Prompt-Injection greift | Spotlighting, Fremdtext als Daten markieren |

Alle vier Fehler erzeugen Antworten, die **plausibel aussehen, aber nicht gedeckt** sind. Genau das fangen Citation-Precision/-Recall und Unsupported-Claim-Rate.
<!-- .element: class="fragment" -->

## Recap & Transfer

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**System-Prompt** setzt Rolle und Grenzen: nur Kontext, kein Vortraining, immer belegen.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Vier-Bausteine-Template** (System, Kontext mit IDs, Frage, Anweisung) ist die wiederverwendbare Struktur.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Quellenattribution** wird gemessen, nicht geglaubt: Prompt-Citations gegen Precision/Recall (ALCE), API-Citations als garantierte Zeiger (aber inkompatibel mit Structured Outputs).
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Refusal** ist eine gewollte Ausgabe, die Sie messen (Unsupported-Claim-Rate, Refusal-Accuracy).
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Kontext-Hygiene** schlägt Kontext-Menge: gezielt statt maximal, Wichtiges an die Ränder.

**Transfer:** Template und Refusal-Gate schließen an **Teil IX (Vertrauenswürdigkeit)** und **Teil X (Sicherheit)** an: Dieselben Prompt-Mechanismen liefern die Basis für Grounding-Confidence und Defense-in-Depth.

## Lernziele und Roadmap

Bis hierher steht die Retrieval-Mechanik. Jetzt schauen wir auf die **Eingangsseite**: woher die Inhalte kommen und wer sie sehen darf.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Heterogene Quellen anbinden: Dokumente, Wikis, Tickets, Policies, jede mit eigenem Ingestion-Muster.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Den Verarbeitungsweg wählen: **Parse-then-Embed** gegen **Vision-native**.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Ein **Metadaten-Schema** und stabile **IDs** vergeben, als Voraussetzung für Update und Löschung.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Berechtigungen im Retrieval** umsetzen: ACL-aware Trimming, Tenant-Separierung, Staleness-Budget.
</div></script></section><section data-separator="

## Quelltypen im Wissensassistenten

Vier Quellklassen. Jede verlangt ein eigenes Ingestion-Muster.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Dokumente** (PDF, HTML, Office): Wartungshandbuch, Datenblätter. Layout-lastig, Tabellen, Diagramme. Versionen relevant.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Wikis / Confluence**: interne Anleitungen, halbstrukturierte Seiten mit Hierarchie und Backlinks. Ändern sich häufig.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Ticketsysteme / Incident-Logs**: Störungsmeldungen zur Pumpe, kurze Einträge, Status-Felder, hoher Durchsatz, viel Rauschen.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Policies**: Sicherheits- und Wartungsvorschriften. Hohe Sensitivität, oft strenge Leseberechtigungen.

Pro Quelltyp entscheiden Sie einmal. **Layout-Treue**, **Aktualisierungstakt** und **Sensitivität** unterscheiden sich stark.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Ingestion-Muster pro Quelltyp

| Quelltyp | Anbindung | Ingestion-Muster |
|---|---|---|
| **Dokumente** (PDF/HTML/Office) | Dateiablage, Storage-Scan | Parser (Layout-Modell), Tabellen als HTML, struktur-bewusstes Chunking |
| **Wikis / Confluence** | API-Connector, Inkrement-Sync | Seiten-Hierarchie als Chunk-Grenze, Backlinks als Metadaten |
| **Ticketsysteme / Incident-Logs** | API-Connector, Polling/Webhook | Felder strukturiert übernehmen, Freitext separat chunken, Status filtern |
| **Policies** | kuratierte Ablage | wenig Volumen, strenge Berechtigungen, Versionierung verpflichtend |

Der **Connector** holt die Rohdaten. Den Rest der Pipeline parametrisieren Sie pro Quelltyp, statt ihn neu zu bauen.

## Zwei Ingestion-Philosophien

Die Kernentscheidung beim Anbinden von Dokumenten: erst **parsen**, oder die Seite als **Bild** embedden.

<img src="media/ingestion_philosophien.svg" alt="" style="width: 82%; object-fit: fill">


Beide Wege gehen vom selben Problem aus: Reale Dokumente tragen viel Information im Layout. Das klassische Extrahieren (OCR, Layout, Lesereihenfolge) verliert Information und macht Fehler, besonders bei Tabellen und Abbildungen.

## Parse-then-Embed: Docling und Marker

Ein Parser wandelt Seiten in sauberes Text/Markdown/HTML, dann indexieren Sie **Text-Embeddings**.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Docling** (IBM Research, seit 2025 LF AI & Data, **MIT-Lizenz**): läuft vollständig **lokal** auf Standard-Hardware, dedizierte Modelle (DocLayNet für Layout, TableFormer für Tabellenstruktur), exportiert verlustfreies JSON oder Markdown. Explizit für RAG gebaut.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Marker** (Datalab): konvertiert PDF, Bilder, Office, HTML, EPUB nach Markdown/JSON/HTML, formatiert Tabellen, Formeln, Code, optional mit LLM-Nachbesserung (`--use_llm`). Benchmark-Stände wechseln mit jeder Version (aktuell olmocr-bench), deshalb auf dem eigenen Korpus messen.

> [!warning]
> **Lizenz beachten:** Marker-Code ist seit Version 2.0 (2026) **Apache-2.0**, die Modellgewichte stehen unter modifizierter OpenRAIL-M (frei für Forschung, Privatnutzung und Firmen unter 5 Mio. USD Umsatz oder Funding). **Kommerzielles Self-Hosting darüber braucht eine kostenpflichtige Lizenz.** Docling (MIT) ist hier unkritisch.
<!-- .element: class="fragment" -->

**Stärken Parse-then-Embed:** jedes Text-Embedding-Modell und jede Vektor-DB nutzbar, Zugriffskontrolle und Löschung bleiben chunk-basiert, Zitate zeigen auf extrahierten Text.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Vision-native: page-images

Statt zu parsen, betten Sie das **Seiten-Bild direkt** ein. Der fehleranfällige Parser entfällt.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**ColPali** (Multi-Vector, Late Interaction): jede Seite wird zu rund 1.000 Patch-Vektoren (Dimension 128), Matching ColBERT-artig per MaxSim. Berichtet: **81.3 nDCG@5** auf ViDoRe, Query-Encoding etwa 30 ms, etwa 257,5 KB pro Seite bei float16.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**DSE** (Single-Vector Screenshot-Embedding): zeigt, dass das Paradigma auch mit einfachem Bi-Encoder funktioniert. Die simplere Variante, didaktisch zuerst.

**nDCG@5** = Rang-Qualitätsmaß der Top-5-Treffer (0 bis 1, höher besser). **Late Interaction** = Query- und Dokument-Tokens werden erst beim Scoring verglichen, nicht zu je einem Vektor verdichtet.
<!-- .element: class="fragment" -->

Das kostet aber: ein **VLM** ist zur Antwortzeit nötig, Zitate sind **Seiten-Bilder statt Textspannen**, der Speicher steigt, und feingranulare Löschung/Schwärzung wird schwer, weil die Granularität die **ganze Seite** ist.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Parse vs. Vision: wie schnell indexiert wird

Auf visuell dichten Korpora (Messung aus dem ColPali-Paper 2024, Benchmark ViDoRe v1):

| Kriterium | Parse-then-Embed (+VLM-Summaries) | Vision (ColPali/DSE) |
|---|---|---|
| Retrieval-Qualität (ViDoRe) | 67.0 nDCG@5 | 81.3 nDCG@5 |
| Indexierung pro Seite | etwa **7,22 s/Seite** | etwa **0,39 s/Seite** (GPU nötig) |
| Speicher | 1 Vektor pro Chunk | etwa 1.000 Vektoren pro Seite |
| Zitierbarkeit | Textspanne | Seiten-Bild + Seitenzahl |
| Generator | Text-LLM genügt | multimodales LLM nötig |

Vision indexiert deutlich schneller und trifft visuell besser, **kostet aber GPU, Speicher und Zitier-Granularität**. Bei gemischten Quellen ist Parse-then-Embed der robustere Default, Vision gezielt für scan-lastige oder tabellen-schwere Handbücher. ColPali ist der Anker von 2024; Nachfolger wie ColQwen2.5 und jina-embeddings-v4 werden auf ViDoRe V3 (2026) verglichen, mehr dazu in Teil XII.

## Tabellen und Charts richtig behandeln

Tabellen kosten am häufigsten unbemerkt Qualität: als Fließtext zerfällt die Struktur.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Regel:** Tabellen als **HTML** (oder Markdown) extrahieren und genau diese Darstellung als Embedding- und Generierungs-Nutzlast behalten, nicht in Fließtext zerschneiden. Unstructured liefert dafür `metadata.text_as_html`.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Charts/Diagramme:** Bildblock extrahieren, dann per VLM eine **Text-Summary** erzeugen.

**Multi-Vector-Retriever (Summary-zu-Roh-Indirection):** Das LangChain-Muster bettet die VLM-**Summary** der Tabelle/Abbildung ein (passt gut zu natürlichsprachigen Fragen) und legt das **Roh-Element** (HTML-Tabelle, Originalbild) im Docstore ab, das zur Antwortzeit ans LLM geht.
<!-- .element: class="fragment" -->

Beispiel: die Frage "Anziehmoment Flanschschrauben" trifft die Summary, das LLM bekommt die exakte HTML-Tabelle mit den Nm-Werten.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Metadaten-Schema

Jeder Chunk trägt Metadaten. Sie steuern Filterung, Versionierung und Berechtigungen.

```yaml
# Chunk-Metadaten: Wartungshandbuch Hydraulikpumpe P-12
id:             "manual-p12-2024#0042"      # doc_id#chunk_no
quelle:         "confluence://wartung/p-12"
titel:          "Wartungshandbuch Hydraulikpumpe P-12"
version:        "2024-Rev-C"
datum:          "2024-11-03"
sensitivitaet:  "intern"                    # oeffentlich | intern | vertraulich
berechtigungen: ["wartung", "engineering"]  # erlaubte Rollen
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Quelle/Titel/Version/Datum:** Provenienz, Konfliktauflösung bei Dubletten, Anzeige im Zitat.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Sensitivität:** steuert Default-Sichtbarkeit und Logging.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Berechtigungen:** das Feld, gegen das im Retrieval gefiltert wird (nächste Folien).
</div></script></section><section data-separator="

## Stabile Dokument- und Chunk-IDs

Ohne stabile IDs gibt es kein gezieltes **Update** und keine gezielte **Löschung**.

```python
doc_id   = "manual-p12-2024"
chunk_no = 42
chunk_id = f"{doc_id}#{chunk_no:04d}"   # "manual-p12-2024#0042"
```

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Muster `doc_id#chunk_no`:** alle Chunks eines Dokuments tragen denselben Präfix, dadurch ist Delete-by-document-id möglich (Präfix-Löschung oder Metadaten-Filter).
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Deterministisch:** gleiche Quelle plus gleicher Chunk ergibt dieselbe ID, das macht Re-Ingestion idempotent.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Logisch vs. physisch löschen:** manche Vektor-DBs (z.B. Weaviate, Tombstone-Prinzip) entfernen den Treffer sofort aus Ergebnissen, räumen die Vektoren aber erst später asynchron auf.

**Konsequenz:** Planen Sie den Löschpfad von Anfang an mit, statt ihn nachzurüsten. Ohne stabile IDs lässt er sich später kaum sauber einbauen.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## ACL-aware Retrieval: Query-Time-Trimming

Prüfen Sie Berechtigungen **zur Anfragezeit** gegen die Permissions-Metadaten, nicht erst im Prompt.

<img src="media/acl_query_time_trimming.svg" alt="" style="width: 88%; object-fit: fill">


Der Filter läuft **vor** der Übergabe an das LLM (Pre-Filter im Vektorstore). Was der Nutzer nicht sehen darf, erreicht den Kontext nie und kann deshalb auch nicht in die Antwort lecken.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Merksatz: Zugriff

> [!important]
> Mit den Rechten des **Nutzers**, nicht des **Modells**.

Das Modell sieht potenziell den gesamten Index. Die Antwort darf nur enthalten, was der **anfragende Nutzer** lesen darf. Deshalb gehört die Zugriffskontrolle in die **Retrieval-Schicht** (deterministisch, filterbar) und nicht in die Modellgewichte.
</div></script></section><section data-separator="

## Tenant-Separierung: getrennte Indizes vs. ACL-Felder

Zwei Wege, Mandanten oder Berechtigungsräume zu trennen.

<div class="two-col">
<div style="flex: 50">

**Getrennte Indizes**

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Ein physischer Index pro Mandant/Bereich.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Harte Isolation, kein versehentliches Leck über Mandantengrenzen.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Mehr Betriebsaufwand, schlechtere Auslastung bei vielen kleinen Mandanten.

</div>
<div style="flex: 50">

**ACL-Felder im gemeinsamen Index**
<!-- .element: class="fragment" data-fragment-index="4" -->

- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->Ein Index, Trennung über `berechtigungen`/`tenant`-Felder beim Filtern.
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Effizient, einfach skalierbar.
- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->Korrektheit hängt an jedem Query-Filter: ein vergessener Filter leckt.

</div>
</div>

> [!tip]
> Faustregel: hohe Schutzbedarfe und wenige große Mandanten sprechen für **getrennte Indizes**, viele kleine Mandanten mit gleichem Schutzbedarf für **ACL-Felder**. Die DSK-Orientierungshilfe zu RAG (Oktober 2025) empfiehlt Mandantentrennung und ein Rechte-/Rollenkonzept für Vektor-DB-Bereiche ausdrücklich als technisch-organisatorische Maßnahme.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Sync, Deletion-Detection und Staleness-Budget

Quellen ändern sich. Der Index muss nachziehen, sonst antwortet der Assistent aus veralteten oder unzulässigen Inhalten.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Sync:** inkrementell per Connector (Webhook oder Polling), Content-Hash zur Dedup, nur Geändertes neu embedden.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Deletion-Detection:** in der Quelle gelöschte Dokumente erkennen und im Index per `doc_id` entfernen, nicht nur neue addieren.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Staleness-Budget:** entzogene Berechtigungen wirken erst ab dem **nächsten ACL-Sync**. Diese Verzögerung als **SLA dokumentieren** (z.B. "Rechteentzug wirkt im Retrieval innerhalb von 15 Minuten").

> [!warning]
> Das Staleness-Fenster lässt sich nicht ganz vermeiden. **Benennen und begrenzen** Sie es im Zugriffskonzept, statt zu erwarten, dass es verschwindet.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Lernziele & Roadmap

Nach diesem Teil können Sie:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Embeddings:** Text als Vektor verstehen und begründen, warum ähnliche Bedeutung zu ähnlicher Richtung im Vektorraum führt.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Cosine Similarity:** Nähe zwischen Vektoren über den Winkel messen und erklären, warum sie bei normalisierten Embeddings dem Skalarprodukt entspricht.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Chunking:** die Chunkgröße gezielt einstellen und Varianten (fixe Fenster, satz-/struktur-basiert, semantisch) gegeneinander abwägen.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Embedding-Modelle:** Kandidaten entlang Dimension, Sprache, Kontextlänge und MMTEB-Score auswählen und mit eigenen Gold-Queries über Recall@k und nDCG bewerten.
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Indexparameter:** Retrieval-k von Kontext-k trennen und die Distanzmetrik zum Embedding-Modell passend wählen.

## Embeddings: Bedeutung als Vektor

Ein **Embedding-Modell** verwandelt einen Textschnipsel in einen Vektor mit hunderten bis tausenden Zahlen (typisch 384, 768 oder 1024 Dimensionen).

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Idee:** Ähnliche Bedeutung → ähnliche Richtung im Vektorraum.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->*"Hund spielt im Garten"* und *"Welpe tobt auf der Wiese"* erzeugen Vektoren, die *räumlich nah beieinander* liegen, auch wenn kein einziges Wort übereinstimmt.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Dimensionen sind nicht interpretierbar (kein Mensch weiß, was Dim 273 "bedeutet"), aber die **Geometrie** funktioniert: Abstand und Winkel kodieren Semantik.

→ Frage: *Wie misst man "Nähe" zwischen zwei Vektoren?*
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Cosine Similarity: Maß für Ähnlichkeit

$$ \\cos(\\theta) \\;=\\; \\frac{\\mathbf{a} \\cdot \\mathbf{b}}{\\|\\mathbf{a}\\|\\,\\|\\mathbf{b}\\|} $$

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Misst den **Winkel** zwischen zwei Vektoren. Länge spielt keine Rolle.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Bereich: $-1$ (entgegengesetzt) … $0$ (orthogonal) … $+1$ (gleich gerichtet).
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Bei **normalisierten** Embeddings ($\\|\\mathbf{a}\\|=\\|\\mathbf{b}\\|=1$) ist die Formel nur noch das Skalarprodukt $\\mathbf{a} \\cdot \\mathbf{b}$, sehr schnell zu berechnen.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Standard für Dense-Retrieval; die gängigen Vektor-DBs unterstützen Cosine direkt, bei Inner Product normalisieren Sie selbst.

**Warum nicht euklidischer Abstand?** Bei Embeddings zählt die *Richtung*, nicht die *Länge*. Cosine ist skalierungs-invariant, lange und kurze Texte werden gleich behandelt.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Chunking: wie Sie Text in Einheiten schneiden

Ein **Chunk** = eine Texteinheit, die eingebettet, indexiert und als Kontext geliefert wird.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Zu **klein** → Information zerrissen, Kontext fehlt.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Zu **groß** → viele Irrelevanzen pro Chunk, Embedding wird "unscharf", Reranker muss härter arbeiten.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Uneinheitlich** → Ranking-Verzerrung, weil Embedding-Ähnlichkeit mit Chunkgröße korreliert.

**Ziel:** Chunks, die *eine kohärente Idee* enthalten, groß genug für Kontext, klein genug für Präzision.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->Variable Länge: Embedding-Statistik kann leiden.
- &shy;<!-- .element: class="fragment" data-fragment-index="7" -->Einfach zu implementieren mit spaCy/NLTK-Sentencizer.

## Semantisches Chunking

Idee: Chunks werden dort getrennt, wo sich die **semantische Richtung** des Textes ändert.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**TextTiling (Hearst 1997)**: klassischer lexikalisch-kohäsiver Algorithmus; Blockvergleich mit Cosine-Similarity auf TF-Vektoren.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Moderne Varianten**, Embedding-basiert: benachbarte Sätze embedden, an Ähnlichkeits-Tälern trennen.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Parent-Child-Chunking**: kleine Chunks embedden (hohe Präzision), größere **Eltern**-Chunks zurückgeben (mehr Kontext fürs LLM).
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Trade-off:** langsamer und nicht-deterministisch, aber oft deutlich bessere Retrieval-Qualität bei Long-Form-Dokumenten.
</div></script></section><section data-separator="

## Semantisches Chunking: visualisiert

Cosine-Similarity zwischen aufeinanderfolgenden Sätzen; **Täler unter dem Schwellwert** = Chunk-Grenze.

## Embedding-Modelle vergleichen

| Achse                  | Frage                                                 |
|------------------------|-------------------------------------------------------|
| **Dimension**          | 384 bis 4096, oft per Matryoshka kürzbar → Speicher und Latenz |
| **Sprache(n)**         | Monolingual (Englisch) vs. mehrsprachig               |
| **Domäne**             | General-Purpose vs. domänen-spezifisch (Legal, Med.)  |
| **Kontextlänge**       | 512 (SBERT, Cohere v3) vs. 8k (OpenAI v3) vs. 32k/128k (Qwen3-Embedding, Cohere v4) |
| **Lizenz / Hosting**   | Open-Source lokal vs. SaaS-API                        |
| **MMTEB-Retrieval-Score** | Benchmark-Wert auf der eigenen Task-Klasse und Sprache |

**Vorgehen:**
<!-- .element: class="fragment" data-fragment-index="0" -->

1. &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**MMTEB-Leaderboard** ([huggingface.co/spaces/mteb/leaderboard](https://huggingface.co/spaces/mteb/leaderboard), über 500 Tasks in 250+ Sprachen) auf die eigene Task-Klasse und Sprache filtern (z.B. *Retrieval, deutsch*). Top-10 als Kandidaten übernehmen, statt blind den populärsten Namen zu nehmen.
2. &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Eigene Gold-Queries durchlaufen → Recall@k und nDCG pro Modell.
3. &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Latenz- und Kostenbudget als Filter.
4. &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Fine-Tuning erst bei echtem Bedarf (Erfahrungswert: wenige Prozentpunkte, dafür stabil).
</div></script></section><section data-separator="

## Sentence-BERT

Reimers & Gurevych (2019): klassisches BERT produziert schlechte Sentence Embeddings. SBERT löst das mit Siamese/Triplet-Training.

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Siamese-Architektur: zwei Encoder teilen Gewichte.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Training mit STS-Datensätzen und NLI-Daten.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Ausgabe: fixe Vektor-Dimension pro Satz, kosinus-vergleichbar.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Warum wichtig:** die meisten heutigen Open-Source-Embeddings folgen dieser Architektur; `sentence-transformers` (sbert.net) ist der De-facto-Standard.
</div></script></section><section data-separator="

## Indexparameter (1/2): Parameter `k`

### Zwei Ebenen von `k`

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Retrieval-k** (erste Stufe): groß genug, damit der Recall hoch ist, typisch 50–200.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Kontext-k** (an den LLM): klein, typisch 3–10; sonst *Lost in the Middle*.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Reranker** schließt die Lücke: Retrieval-k → Reranker → Kontext-k.

**Faustregel:** Zielen Sie im Retrieval auf hohen Recall, lieber 100 Kandidaten zu viel als ein relevanter zu wenig. Der Reranker kürzt anschließend auf die präzisesten Treffer fürs LLM.
<!-- .element: class="fragment" -->

## Indexparameter (2/2): Distanzmetrik

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Cosine Similarity**: Standard für normalisierte Embeddings.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Inner Product**: wenn Embeddings nicht normalisiert sind.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Euclidean (L2)**: selten besser; relevant nur für spezifische Modelle.

> [!warning]
> Metrik muss zum Embedding-Modell passen. Model-Card oder Docstring lesen. Falsche Metrik = Qualität bricht ein, ohne dass eine Fehlermeldung kommt.

## Recap & Transfer

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Embeddings** kodieren Bedeutung als Vektor; **Cosine Similarity** misst die Richtung und ist bei normalisierten Embeddings nur das Skalarprodukt.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Chunking** wird oft unterschätzt: ein Chunk soll eine kohärente Idee tragen, groß genug für Kontext, klein genug für Präzision; semantisches Chunking trennt an Ähnlichkeits-Tälern.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Embedding-Modelle** wählt man entlang Dimension, Sprache, Kontextlänge und MMTEB-Score, validiert über eigene Gold-Queries mit Recall@k und nDCG.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Indexparameter:** Retrieval-k hoch für Recall, Kontext-k klein gegen Lost in the Middle; die Distanzmetrik muss zum Embedding-Modell passen.

**Übergang zu Teil VI: Hybrid Search & Reranking:** Dense-Retrieval allein verfehlt exakte Begriffe und Randfälle; im nächsten Teil kombinieren wir es mit lexikalischer Suche und schalten einen Reranker davor, der die Retrieval-Kandidaten auf die präzisesten Treffer fürs LLM kürzt.

## Lernziele & Roadmap

Nach diesem Teil können Sie:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Hybrid-Retrieval:** begründen, warum Dense- und Sparse-Retriever sich ergänzen statt zu ersetzen.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Fusion:** Trefferlisten per Reciprocal Rank Fusion (RRF) und linearer Score-Fusion zusammenführen und den Trade-off zwischen beiden einordnen.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Sparse Neural:** gelernt-sparse Retriever wie SPLADE als dritte Achse neben BM25 und Dense einordnen.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Bi- vs. Cross-Encoder:** getrennte und gemeinsame Encodierung unterscheiden und erklären, warum nur der Bi-Encoder vorberechenbar ist.
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Reranking:** den Cross-Encoder als Reranker auf eine Top-N-Liste einsetzen und Qualität gegen Latenz und Kosten abwägen.
</div></script></section><section data-separator="

## Warum ein Retriever selten reicht

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Dense Retriever** (Embeddings): stark bei Paraphrasen, Synonymen, Bedeutung.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Sparse Retriever** (BM25): stark bei exakten Begriffen, Eigennamen, Zahlen, Codes.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Typisches Beispiel:** Frage enthält "Paragraph 823 BGB". Dense sucht nach Bedeutung und findet *ähnliche* Paragraphen; BM25 findet den exakten.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Konsequenz:** Hybrid-Retrieval ist in der Praxis fast immer besser als eines allein.
</div></script></section><section data-separator="
?

" data-separator-vertical="

" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="smaller drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Hybrid-Search (1/3): Reciprocal Rank Fusion

**Problem.** Zwei Retriever (BM25, Dense) liefern unterschiedliche Trefferlisten. Welche Reihenfolge geht ans LLM?
<!-- .element: class="fragment" data-fragment-index="0" -->

**Idee.** Ränge addieren statt Scores normalisieren. Wer in **beiden** Listen weit oben steht, gewinnt, auch wenn er nirgends Spitzenreiter ist.
<!-- .element: class="fragment" data-fragment-index="1" -->

$$ \\text{RRF}(d) = \\sum\_{i=1}^{n} \\frac{1}{k + \\text{rank}\_i(d)} \\qquad k = 60 \\text{ (Cormack et al. 2009)} $$
<!-- .element: class="fragment" data-fragment-index="2" -->

*Warum gerade $k = 60$?* Kleines $k$ → Rang 1 dominiert, ein Retriever reicht zum Sieg. Großes $k$ → Top-Ränge wiegen ähnlich → Konsens-Treffer gewinnen.
<!-- .element: class="fragment" data-fragment-index="3" -->
</div></script></section><section data-separator="
?
---
?
" data-separator-vertical="
?
--
?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="smaller drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Hybrid-Search (2/3): RRF am Beispiel

Vier Dokumente, zwei Trefferlisten, $k = 60$:

| Dokument | BM25-Rang | Dense-Rang | Beitrag (= $\\frac{1}{60+\\text{Rang}}$) | Summe |
|---|:-:|:-:|---|---|
| A | 1 | 3 | 1/61 + 1/63 | 0.03226 |
| B | 2 | 1 | 1/62 + 1/61 | **0.03252** *(gewinnt)* |
| C | 3 | 2 | 1/63 + 1/62 | 0.03200 |
| D | n/a | 4 | 0 + 1/64 | 0.01563 |

B gewinnt, obwohl BM25 ihn nur auf Platz 2 hatte. Der Konsens schlägt den einseitigen BM25-Sieger A.
<!-- .element: class="fragment" data-fragment-index="0" -->

Fehlt ein Dokument bei einem Retriever, ist sein Beitrag dort 0 (siehe D). RRF braucht dafür keine Score-Normalisierung, es zählt nur der Rang.
<!-- .element: class="fragment" data-fragment-index="1" -->
</div></script></section><section data-separator="
?
---

" data-separator-vertical="
?
--

" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="smaller drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Hybrid-Search (3/3): Lineare Score-Fusion

$$ \\text{score}(d) = \\alpha \\cdot s\_\\text{dense}(d) + (1-\\alpha) \\cdot s\_\\text{sparse}(d) $$

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Braucht **Score-Normalisierung** (Min-Max, z-Score): BM25-Scores und Cosine-Similarities leben auf verschiedenen Skalen, sind ohne Vorbehandlung nicht vergleichbar.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->$\\alpha$ per Validierungsset kalibrieren: typisch zwischen 0.3 und 0.7, abhängig davon, ob die Korpusfragen eher exakte Begriffe oder eher Paraphrasen enthalten.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Trade-off zu RRF:** mehr Stellschrauben, aber empfindlicher gegenüber Score-Drift, wenn Embedding- oder BM25-Implementierung wechselt.
</div></script></section><section data-separator="

## Sparse Neural Retrievers

Neben klassischem BM25 gibt es **gelernt-sparse** Retriever:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**SPLADE** & Varianten: Embeddings mit wenigen, interpretierbaren Dimensionen.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Funktionieren mit Inverted Indexes (wie BM25), skalieren gut; produktiv z. B. als Elastic ELSER oder OpenSearch Neural Sparse.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Lernen Term-Gewichte und implizite Query-Expansion.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Einsatz:** dritte Achse neben BM25 und Dense, besonders bei Fachsprache.
</div></script></section><section data-separator="

## Bi-Encoder: getrennte Encodierung (1/2)

<img src="media/bi_encoder_getrennte_encodierung.svg" alt="" style="width: 42%; object-fit: fill">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Trennung:** Query und Dokument durchlaufen getrennt denselben Encoder.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Vergleich:** zwei Vektoren, Ähnlichkeit per Cosine.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Architektur:** SBERT-Siamese (von der vorigen Folie).

- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Schlüsseleigenschaft:** das Doc-Embedding ist Frage-unabhängig: einmal vorberechnen, in den Index legen, beliebig viele Queries dagegen laufen lassen.
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Skalierung:** ANN-Suche (*Approximate Nearest Neighbor*) über Millionen Dokumente in Millisekunden.
</div></script></section><section data-separator="

## Cross-Encoder: gemeinsame Encodierung (2/2)

<img src="media/cross_encoder_gemeinsame_encodierung.svg" alt="" style="width: 68%; object-fit: fill">


- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Konkatenation:** Query + Dokument werden zu einem Eingabetext zusammengefügt (Trennsymbol dazwischen).
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Cross-Attention:** jedes Wort der Frage „sieht" jedes Wort des Dokuments, und umgekehrt.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Was es bringt:** erkennt Bezugnahme, Negation, gleiche Fundstellen (*„Paragraph 823"*), was reiner Vektor-Vergleich verliert.

- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Konsequenz:** jede interne Repräsentation hängt von der Frage ab → keine Vorberechnung möglich.
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Einsatz:** nur als Reranker auf kurzer Trefferliste (Top-50 bis Top-200), nicht für die Erst-Suche im Index.
- &shy;<!-- .element: class="fragment" data-fragment-index="6" -->**Modelle (Stand 2026):** bge-reranker-v2-m3, Qwen3-Reranker (0,6B bis 8B), mxbai-rerank-v2 lokal; Cohere Rerank 3.5 als API. Late-Interaction-Modelle (ColBERT-Familie) liegen zwischen Bi- und Cross-Encoder.
</div></script></section><section data-separator="

## Reranking mit Cross-Encodern

### Bi-Encoder vs. Cross-Encoder im Einsatz

| Aspekt              | Bi-Encoder (Retrieval) | Cross-Encoder (Reranking)       |
|---------------------|------------------------|---------------------------------|
| Eingabe             | Query und Doc getrennt | Query + Doc konkateniert        |
| Ausgabe             | Zwei Vektoren          | Ein Relevanz-Logit, per Sigmoid 0–1 |
| Skalierung          | ANN auf Millionen Docs | Nur Top-N (50–200) rerankbar    |
| Latenz pro Query    | 5–20 ms                | 50–500 ms (abh. von Modell/k)   |
| Qualität            | gut                    | meist deutlich besser           |

## Trade-offs: Qualität vs. Kosten

| Stellschraube            | Qualitätsgewinn | Kostenpunkt                  |
|--------------------------|-----------------|------------------------------|
| Größeres Embedding-Modell | niedrig–mittel  | GPU-Kosten, Latenz           |
| Hybrid (BM25 + Dense)    | mittel          | Zweiter Index, mehr RAM      |
| Cross-Encoder-Reranking  | **hoch**        | Latenz + CPU/GPU pro Query   |
| Höheres `k` im Retrieval | niedrig–mittel  | Mehr Reranker-Last           |
| LLM-as-Reranker          | sehr hoch       | LLM-Token-Kosten pro Kandidat |
| Fine-Tuning auf Domäne   | hoch (stabil)   | Daten-Annotation, Training   |
</div></script></section><section data-separator="

## RAG Best Practices nach Wang et al. (2024)

Wang et al. (Fudan, EMNLP 2024) vergleichen systematisch Varianten jeder Pipeline-Stufe:

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->**Hybrid-Retrieval** (sparse + dense) mit HyDE (hypothetische Antwort als Query) lieferte die beste Trefferqualität, Hybrid allein den besten Kompromiss aus Qualität und Latenz.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->**Reranking** bringt spürbare Gewinne: monoT5 als ausgewogene Wahl, RankLLaMA für Bestleistung bei höherer Latenz.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->**Repacking:** die relevantesten Chunks ans Ende des Kontexts ("reverse") schnitt am besten ab, passend zu Lost in the Middle.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->**Chunk-Größe** ist domänenabhängig; 256 bis 512 Tokens waren im Test der beste Startwert, den Sie für Ihre Domäne nachjustieren.
- &shy;<!-- .element: class="fragment" data-fragment-index="5" -->**Kontext-Kompression** (Recomp) spart Tokens bei nahezu gleicher Antwortqualität.

Praxisheuristik jenseits des Papers: Budget fließt meist besser ins Retrieval als in ein größeres LLM, und ein sauberer Kontext macht das Prompt-Template weniger kritisch.
<!-- .element: class="fragment" -->
</div></script></section><section data-separator="

## Recap & Transfer

- &shy;<!-- .element: class="fragment" data-fragment-index="1" -->Hybrid-Retrieval (Dense + Sparse) schlägt einen einzelnen Retriever fast immer; RRF fusioniert per Rang ohne Score-Normalisierung, lineare Score-Fusion per kalibriertem $\\alpha$ mit Normalisierung.
- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Der Bi-Encoder encodiert Query und Dokument getrennt, ist vorberechenbar und skaliert per ANN auf Millionen Dokumente.
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Der Cross-Encoder encodiert Query und Dokument gemeinsam (Cross-Attention), ist nicht vorberechenbar und dient nur als Reranker auf einer kurzen Top-N-Liste.
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Reranking bringt den höchsten Qualitätsgewinn, kostet aber Latenz: ein besserer Retriever wiegt oft mehr als ein größeres LLM.

**Übergang zu Teil VII: Retrieval-Qualität messen:** Diese Stellschrauben (Hybrid, Reranking, $k$) lohnen sich nur, wenn wir ihren Effekt belegen können, also brauchen wir Metriken wie nDCG, um Qualität messbar zu machen.
